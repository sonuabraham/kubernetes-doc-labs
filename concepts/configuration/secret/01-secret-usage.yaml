# Using a Secret as env vars and as files, and the docs' "Secret visible to one container" pattern:
# only "frontend" mounts the credentials; "sidecar" in the same Pod doesn't see them.
apiVersion: v1
kind: Secret
metadata: {name: db-creds}
type: Opaque
stringData:
  username: app
  password: s3cr3t-pw
---
apiVersion: v1
kind: Pod
metadata: {name: secret-consumer}
spec:
  containers:
  - name: frontend
    image: busybox:1.36
    command: ["sleep", "3600"]
    env:
    - name: DB_USER
      valueFrom: {secretKeyRef: {name: db-creds, key: username}}
    volumeMounts:
    - {name: creds, mountPath: /etc/creds, readOnly: true}
  - name: sidecar
    image: busybox:1.36
    command: ["sleep", "3600"]
  volumes:
  - name: creds
    secret:
      secretName: db-creds
      defaultMode: 0400
      items:
      - {key: password, path: db/password}
