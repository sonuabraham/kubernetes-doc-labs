# "Configure least-privilege access to Secrets": a user who may NOT read Secrets but MAY create Pods
# can still read any Secret in the namespace by mounting it.
apiVersion: v1
kind: ServiceAccount
metadata: {name: pod-creator}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: pod-creator}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: pod-creator}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: pod-creator}
subjects:
- {kind: ServiceAccount, name: pod-creator, namespace: secret-demo}
