# The docs' frontend with real images: app burns CPU (to hit its 500m limit), log-aggregator idles
apiVersion: v1
kind: Pod
metadata:
  name: frontend-runnable
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "while true; do :; done"]
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
  - name: log-aggregator
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
