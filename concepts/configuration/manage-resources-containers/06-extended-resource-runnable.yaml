# The docs' my-pod (cpu 2 + 1 example.com/foo) with a real image; 6 copies via a Deployment to exhaust the 5 advertised "foo"
apiVersion: apps/v1
kind: Deployment
metadata: {name: foo-users}
spec:
  replicas: 6
  selector: {matchLabels: {app: foo-users}}
  template:
    metadata: {labels: {app: foo-users}}
    spec:
      containers:
      - name: my-container
        image: busybox:1.36
        command: ["sleep", "3600"]
        resources:
          requests: {cpu: 100m, example.com/foo: 1}
          limits: {example.com/foo: 1}
