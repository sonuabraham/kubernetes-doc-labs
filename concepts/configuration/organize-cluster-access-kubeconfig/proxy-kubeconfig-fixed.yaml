# The docs' proxy example with the context actually wired up (the docs' context has no cluster/user)
# and a current-context, so kubectl really goes through proxy-url. The user gets a dummy token: with NO
# credentials at all kubectl falls through to the last merge rule and PROMPTS ("Please enter Username:").
apiVersion: v1
kind: Config
clusters:
- cluster:
    proxy-url: http://proxy.example.org:3128
    server: https://k8s.example.org/k8s/clusters/c-xxyyzz
  name: development
users:
- name: developer
  user:
    token: dummy-token
contexts:
- context:
    cluster: development
    user: developer
  name: development
current-context: development
