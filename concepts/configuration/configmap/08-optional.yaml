# References to a ConfigMap that doesn't exist: required (Pod can't start) vs optional (Pod starts, empty/unset)
apiVersion: v1
kind: Pod
metadata: {name: needs-missing}
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    env:
    - name: COLOR
      valueFrom: {configMapKeyRef: {name: does-not-exist, key: color}}
---
apiVersion: v1
kind: Pod
metadata: {name: optional-missing}
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "echo COLOR=[$COLOR]; ls /cfg | wc -l; sleep 3600"]
    env:
    - name: COLOR
      valueFrom: {configMapKeyRef: {name: does-not-exist, key: color, optional: true}}
    volumeMounts: [{name: cfg, mountPath: /cfg}]
  volumes:
  - name: cfg
    configMap: {name: does-not-exist, optional: true}
