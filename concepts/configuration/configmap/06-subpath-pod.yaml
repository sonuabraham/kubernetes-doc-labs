# Same ConfigMap mounted twice: as a volume (gets updates) and one key via subPath (frozen at start)
apiVersion: v1
kind: Pod
metadata: {name: subpath-pod}
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts:
    - {name: game, mountPath: /config}
    - {name: game, mountPath: /etc/game.properties, subPath: game.properties}
  volumes:
  - name: game
    configMap: {name: game-demo}
