# One Pod per QoS class (+ a high-priority Burstable one): only plain Burstable Pods may swap under LimitedSwap
apiVersion: v1
kind: Pod
metadata: {name: besteffort}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: burstable}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"], resources: {requests: {memory: 512Mi}, limits: {memory: 1Gi}}}]
---
apiVersion: v1
kind: Pod
metadata: {name: guaranteed}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"], resources: {requests: {memory: 512Mi, cpu: 100m}, limits: {memory: 512Mi, cpu: 100m}}}]
---
apiVersion: v1
kind: Pod
metadata: {name: burstable-critical, namespace: kube-system}
spec:
  priorityClassName: system-node-critical
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"], resources: {requests: {memory: 512Mi}, limits: {memory: 1Gi}}}]
