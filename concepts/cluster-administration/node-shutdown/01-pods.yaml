# A regular Pod and a critical Pod (system-node-critical, kube-system) that log when SIGTERM arrives
apiVersion: v1
kind: Pod
metadata: {name: regular, namespace: default}
spec:
  terminationGracePeriodSeconds: 60
  containers:
  - name: c
    image: busybox:1.36
    command: ["sh", "-c", "trap 'echo SIGTERM at $(date +%T); sleep 5; exit 0' TERM; echo started; while true; do sleep 1; done"]
---
apiVersion: v1
kind: Pod
metadata: {name: critical, namespace: kube-system}
spec:
  priorityClassName: system-node-critical
  terminationGracePeriodSeconds: 60
  containers:
  - name: c
    image: busybox:1.36
    command: ["sh", "-c", "trap 'echo SIGTERM at $(date +%T); sleep 5; exit 0' TERM; echo started; while true; do sleep 1; done"]
