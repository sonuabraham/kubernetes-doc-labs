# An HTTP app (agnhost netexec answers /hostname) behind a ClusterIP Service and a LoadBalancer Service
apiVersion: v1
kind: Namespace
metadata: {name: proxies-lab}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: proxies-lab}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers: [{name: web, image: registry.k8s.io/e2e-test-images/agnhost:2.53, args: ["netexec", "--http-port=8080"], ports: [{containerPort: 8080, name: http}]}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: proxies-lab}
spec: {selector: {app: web}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: v1
kind: Service
metadata: {name: web-lb, namespace: proxies-lab}
spec: {type: LoadBalancer, selector: {app: web}, ports: [{port: 80, targetPort: http}]}
