# "Fail open and validate the final state": the slow webhook may be skipped (failurePolicy Ignore), so the
# important rule is ALSO enforced in-process by a ValidatingAdmissionPolicy (no network, can't time out).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: no-forbidden-label}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector: {matchLabels: {webhook-lab: enabled}}
    resourceRules: [{apiGroups: [""], apiVersions: ["v1"], operations: ["CREATE", "UPDATE"], resources: ["pods"]}]
  validations:
  - expression: '!has(object.metadata.labels) || !("forbidden" in object.metadata.labels) || object.metadata.labels["forbidden"] != "true"'
    message: "label forbidden=true is not allowed (final-state policy)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: no-forbidden-label}
spec: {policyName: no-forbidden-label, validationActions: [Deny]}
