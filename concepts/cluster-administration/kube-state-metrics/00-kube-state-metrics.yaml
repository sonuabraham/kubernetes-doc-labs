# Minimal kube-state-metrics install (official image), read-only RBAC (list/watch), Service on :8080
apiVersion: v1
kind: Namespace
metadata: {name: ksm}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: kube-state-metrics, namespace: ksm}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: ksm-lab}
rules:
- apiGroups: ["", "apps", "batch", "autoscaling", "policy", "networking.k8s.io", "storage.k8s.io", "coordination.k8s.io", "certificates.k8s.io", "admissionregistration.k8s.io", "discovery.k8s.io"]
  resources: ["*"]
  verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: ksm-lab}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ksm-lab}
subjects: [{kind: ServiceAccount, name: kube-state-metrics, namespace: ksm}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kube-state-metrics, namespace: ksm}
spec:
  selector: {matchLabels: {app: kube-state-metrics}}
  template:
    metadata: {labels: {app: kube-state-metrics}}
    spec:
      serviceAccountName: kube-state-metrics
      containers:
      - name: ksm
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.15.0
        args: ["--port=8080", "--telemetry-port=8081"]
        ports: [{containerPort: 8080, name: http}]
---
apiVersion: v1
kind: Service
metadata: {name: kube-state-metrics, namespace: ksm}
spec: {selector: {app: kube-state-metrics}, ports: [{port: 8080, name: http}]}
