# Demo for the kubectl lab (namespace kubectl-demo): something to manage,
# inspect, debug and script against.
apiVersion: v1
kind: Namespace
metadata:
  name: kubectl-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kubectl-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kubectl-demo
spec:
  selector: {app: web}
  ports: [{port: 80}]
