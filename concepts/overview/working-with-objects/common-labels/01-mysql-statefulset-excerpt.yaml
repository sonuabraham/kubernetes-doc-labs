# Lab 1: The docs' first StatefulSet excerpt. The metadata.labels block is
# VERBATIM; the rest ("excerpt") is filled in so it can be applied.
# Containers run the tiny pause image - this lab is only about labels.
# This is an excerpt
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: mysql-abcxyz
    app.kubernetes.io/version: "5.7.21"
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: wordpress
    app.kubernetes.io/managed-by: Helm
# --- filled in for the lab ---
  name: mysql-abcxyz
  namespace: common-labels-demo
spec:
  serviceName: mysql-abcxyz
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
      app.kubernetes.io/instance: mysql-abcxyz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/instance: mysql-abcxyz
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: wordpress
    spec:
      containers: [{name: mysql, image: "registry.k8s.io/pause:3.10"}]
