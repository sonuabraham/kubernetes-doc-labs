# Lab 4: A SECOND installation of the same application (another website).
# Same app.kubernetes.io/name values, different app.kubernetes.io/instance:
# "Every instance of an application must have a unique name."
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/instance: wordpress-blog2
    app.kubernetes.io/version: "4.9.4"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: wordpress
# --- filled in for the lab ---
  name: wordpress-blog2
  namespace: common-labels-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress
      app.kubernetes.io/instance: wordpress-blog2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress
        app.kubernetes.io/instance: wordpress-blog2
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: wordpress
    spec:
      containers: [{name: wordpress, image: "registry.k8s.io/pause:3.10"}]
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/instance: wordpress-blog2
    app.kubernetes.io/version: "4.9.4"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: wordpress
# --- filled in for the lab ---
  name: wordpress-blog2
  namespace: common-labels-demo
spec:
  selector:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/instance: wordpress-blog2
  ports: [{port: 80}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: mysql-blog2
    app.kubernetes.io/version: "5.7.21"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: wordpress
# --- filled in for the lab ---
  name: mysql-blog2
  namespace: common-labels-demo
spec:
  serviceName: mysql-blog2
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
      app.kubernetes.io/instance: mysql-blog2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/instance: mysql-blog2
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: wordpress
    spec:
      containers: [{name: mysql, image: "registry.k8s.io/pause:3.10"}]
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: mysql-blog2
    app.kubernetes.io/version: "5.7.21"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: wordpress
# --- filled in for the lab ---
  name: mysql-blog2
  namespace: common-labels-demo
spec:
  selector:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: mysql-blog2
  ports: [{port: 3306}]
