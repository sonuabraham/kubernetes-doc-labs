# Lab 2: "A Simple Stateless Service" - Deployment + Service. The two
# metadata.labels blocks are VERBATIM from the docs (simplest form: name + instance).
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: myservice
    app.kubernetes.io/instance: myservice-abcxyz
# --- filled in for the lab ---
  name: myservice-abcxyz
  namespace: common-labels-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: myservice
      app.kubernetes.io/instance: myservice-abcxyz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: myservice
        app.kubernetes.io/instance: myservice-abcxyz
    spec:
      containers: [{name: myservice, image: "registry.k8s.io/pause:3.10"}]
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: myservice
    app.kubernetes.io/instance: myservice-abcxyz
# --- filled in for the lab ---
  name: myservice-abcxyz
  namespace: common-labels-demo
spec:
  selector:
    app.kubernetes.io/name: myservice
    app.kubernetes.io/instance: myservice-abcxyz
  ports: [{port: 80}]
