# Lab 3: "Web Application With A Database" - WordPress Deployment + Service and
# MySQL StatefulSet + Service. All four metadata.labels blocks are VERBATIM.
# NOTE: the MySQL StatefulSet here is the same object as Lab 1's (mysql-abcxyz).
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/instance: wordpress-abcxyz
    app.kubernetes.io/version: "4.9.4"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: wordpress
# --- filled in for the lab ---
  name: wordpress-abcxyz
  namespace: common-labels-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress
      app.kubernetes.io/instance: wordpress-abcxyz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress
        app.kubernetes.io/instance: wordpress-abcxyz
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: wordpress
    spec:
      containers: [{name: wordpress, image: "registry.k8s.io/pause:3.10"}]
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/instance: wordpress-abcxyz
    app.kubernetes.io/version: "4.9.4"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: wordpress
# --- filled in for the lab ---
  name: wordpress-abcxyz
  namespace: common-labels-demo
spec:
  selector:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/instance: wordpress-abcxyz
  ports: [{port: 80}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: mysql-abcxyz
    app.kubernetes.io/version: "5.7.21"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: wordpress
# --- filled in for the lab ---
  name: mysql-abcxyz
  namespace: common-labels-demo
spec:
  serviceName: mysql-abcxyz
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
      app.kubernetes.io/instance: mysql-abcxyz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/instance: mysql-abcxyz
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: wordpress
    spec:
      containers: [{name: mysql, image: "registry.k8s.io/pause:3.10"}]
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: mysql-abcxyz
    app.kubernetes.io/version: "5.7.21"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: wordpress
# --- filled in for the lab ---
  name: mysql-abcxyz
  namespace: common-labels-demo
spec:
  selector:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: mysql-abcxyz
  ports: [{port: 3306}]
