# Demo for Owners and Dependents (namespace owners-demo):
#   Deployment web -> owns ReplicaSet -> owns Pods       (set by controllers)
#   Service web    -> owns EndpointSlice(s)              (+ label kubernetes.io/service-name=web)
apiVersion: v1
kind: Namespace
metadata:
  name: owners-demo
---
apiVersion: v1
kind: Namespace
metadata:
  name: owners-other
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: owners-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: owners-demo
spec:
  selector: {app: web}
  ports: [{port: 80}]
