# Demo objects for the Field Selectors lab - one object per field value worth
# filtering on. Namespace: fieldsel-demo.
#
#   pod running        restartPolicy Always   -> status.phase=Running
#   pod crashing       restartPolicy Always   -> status.phase=Running (CrashLoopBackOff is NOT a phase)
#   pod pending        nodeSelector no match  -> status.phase=Pending
#   pod done           restartPolicy Never    -> status.phase=Succeeded
#   pod broken         restartPolicy Never    -> status.phase=Failed
#   pod on-host-net    hostNetwork: true      -> spec.hostNetwork=true
#   services: ClusterIP, NodePort, headless (spec.clusterIP=None)
#   secrets: Opaque, kubernetes.io/basic-auth
#   job hello (status.successful=1), statefulset db
apiVersion: v1
kind: Namespace
metadata:
  name: fieldsel-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: builder
  namespace: fieldsel-demo
---
apiVersion: v1
kind: Pod
metadata: {name: running, namespace: fieldsel-demo}
spec:
  restartPolicy: Always
  containers: [{name: c, image: "registry.k8s.io/pause:3.10"}]
---
apiVersion: v1
kind: Pod
metadata: {name: crashing, namespace: fieldsel-demo}
spec:
  restartPolicy: Always
  containers: [{name: c, image: "busybox:1.36", command: ["sh", "-c", "sleep 2; exit 1"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: pending, namespace: fieldsel-demo}
spec:
  nodeSelector: {disk: does-not-exist}
  containers: [{name: c, image: "registry.k8s.io/pause:3.10"}]
---
apiVersion: v1
kind: Pod
metadata: {name: done, namespace: fieldsel-demo}
spec:
  restartPolicy: Never
  serviceAccountName: builder
  containers: [{name: c, image: "busybox:1.36", command: ["true"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: broken, namespace: fieldsel-demo}
spec:
  restartPolicy: Never
  containers: [{name: c, image: "busybox:1.36", command: ["false"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: on-host-net, namespace: fieldsel-demo}
spec:
  hostNetwork: true
  containers: [{name: c, image: "registry.k8s.io/pause:3.10"}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: fieldsel-demo}
spec:
  selector: {app: web}
  ports: [{port: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: web-nodeport, namespace: fieldsel-demo}
spec:
  type: NodePort
  selector: {app: web}
  ports: [{port: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: db-headless, namespace: fieldsel-demo}
spec:
  clusterIP: None
  selector: {app: db}
  ports: [{port: 5432}]
---
apiVersion: v1
kind: Secret
metadata: {name: plain, namespace: fieldsel-demo}
type: Opaque
stringData: {k: v}
---
apiVersion: v1
kind: Secret
metadata: {name: login, namespace: fieldsel-demo}
type: kubernetes.io/basic-auth
stringData: {username: admin, password: s3cret}
---
apiVersion: batch/v1
kind: Job
metadata: {name: hello, namespace: fieldsel-demo}
spec:
  template:
    spec:
      restartPolicy: Never
      containers: [{name: c, image: "busybox:1.36", command: ["echo", "hello"]}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: db, namespace: fieldsel-demo}
spec:
  serviceName: db-headless
  replicas: 1
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      containers: [{name: c, image: "registry.k8s.io/pause:3.10"}]
