# Lab 2: One annotation for each kind of information the docs list.
# Values are always STRINGS - but they may hold anything: URLs, JSON, YAML,
# multi-line text, spaces, characters labels don't allow.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: annotations-demo
  labels:
    app: web                                    # identifying -> label
  annotations:
    # build / release / image information
    example.com/git-commit: "9f2c1e7"
    example.com/build-time: "2026-11-11T09:30:00Z"
    example.com/pr: "https://github.com/example/web/pull/42"
    # pointers to logging / monitoring repositories
    example.com/dashboard: "https://grafana.example.com/d/web?var-ns=annotations-demo"
    # people responsible
    example.com/oncall: "Team Web - pager +1 555 0100 (24x7)"
    # structured data (JSON) and multi-line text
    example.com/rollout-config: '{"maxSurge": "25%", "checkpoints": [10, 50, 100]}'
    example.com/notes: |
      Do not scale below 2 replicas.
      Owner: platform team.
    # directive to a tool: tells "kubectl rollout history" WHY this revision exists
    kubernetes.io/change-cause: "initial release v1"
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
      annotations:
        # directive to kubectl: which container "kubectl logs/exec" use by default
        kubectl.kubernetes.io/default-container: app
    spec:
      containers:
      - name: sidecar
        image: busybox:1.36
        command: ["sh", "-c", "while true; do echo sidecar log; sleep 5; done"]
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "while true; do echo APP log; sleep 5; done"]
