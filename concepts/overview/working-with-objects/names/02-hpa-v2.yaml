# Lab 3: An HPA created through API version autoscaling/v2 ...
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-hpa
  namespace: names-demo
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: myapp-1234}
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 80}}
