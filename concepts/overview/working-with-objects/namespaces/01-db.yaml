# Applied once per namespace (kubectl apply -f 01-db.yaml -n <ns>): no
# namespace in the file, so the SAME manifest works in every environment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo:1.0
        args: ["-text=db in $(NS)"]
        env:
        - name: NS
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector: {app: db}
  ports:
  - port: 80
    targetPort: 5678
