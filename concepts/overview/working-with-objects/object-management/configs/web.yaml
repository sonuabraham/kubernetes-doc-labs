# Declarative object configuration: kubectl diff/apply -f configs/
# kubectl decides per object whether to create or patch it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
    app.kubernetes.io/part-of: configs-demo   # used for --prune in Lab 4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/part-of: configs-demo
spec:
  selector:
    app: web
  ports:
  - port: 80
