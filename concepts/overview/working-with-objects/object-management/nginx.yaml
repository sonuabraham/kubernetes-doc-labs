# Used by the docs' imperative object configuration commands:
#   kubectl create  -f nginx.yaml
#   kubectl replace -f nginx.yaml
#   kubectl delete  -f nginx.yaml -f redis.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
