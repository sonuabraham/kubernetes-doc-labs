# Lab 4: Bin packing - this pod requests more CPU than the node has.
# The scheduler cannot fit it anywhere -> Pending, "Insufficient cpu".
apiVersion: v1
kind: Pod
metadata:
  name: too-big
  namespace: overview-demo
spec:
  containers:
  - name: c
    image: registry.k8s.io/pause:3.10
    resources:
      requests: {cpu: "64"}
