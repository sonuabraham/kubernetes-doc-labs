# Same busybox six ways (the last needs AppArmor on the node). Each prints: uid, seccomp mode, AppArmor label, effective capabilities, and tries
# mkdir + chown + a mount.
apiVersion: v1
kind: Pod
metadata: {name: default}
spec:
  containers:
  - name: c
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata: {name: runtime-default}
spec:
  securityContext:
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: c
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata: {name: localhost-seccomp}
spec:
  securityContext:
    seccompProfile: {type: Localhost, localhostProfile: profiles/deny-mkdir.json}
  containers:
  - name: c
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata: {name: restricted}
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: c
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, readOnlyRootFilesystem: true}
---
apiVersion: v1
kind: Pod
metadata: {name: privileged}
spec:
  containers:
  - name: c
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    securityContext: {privileged: true}
---
# AppArmor RuntimeDefault - needs AppArmor usable by the kubelet on the node
apiVersion: v1
kind: Pod
metadata: {name: apparmor}
spec:
  securityContext:
    appArmorProfile: {type: RuntimeDefault}
  containers:
  - name: c
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
