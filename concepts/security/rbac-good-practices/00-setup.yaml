# rbac-demo: a "victim" Secret, a powerful ServiceAccount (ci-deployer, edit-like), and a PSA-restricted namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: rbac-demo
  labels: {pod-security.kubernetes.io/enforce: baseline}
---
apiVersion: v1
kind: Secret
metadata: {name: db-password, namespace: rbac-demo}
stringData: {password: hunter2}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ci-deployer, namespace: rbac-demo}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: ci-deployer-edit, namespace: rbac-demo}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edit}
subjects: [{kind: ServiceAccount, name: ci-deployer, namespace: rbac-demo}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: attacker, namespace: rbac-demo}
