# A Pod with the two memory-backed volume kinds the page talks about: a Secret and an emptyDir medium: Memory
apiVersion: v1
kind: Namespace
metadata: {name: linsec-demo}
---
apiVersion: v1
kind: Secret
metadata: {name: s, namespace: linsec-demo}
stringData: {k: v}
---
apiVersion: v1
kind: Pod
metadata: {name: sec, namespace: linsec-demo}
spec:
  containers:
  - name: sec
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts:
    - {name: s, mountPath: /s}
    - {name: m, mountPath: /m}
  volumes:
  - {name: s, secret: {secretName: s}}
  - {name: m, emptyDir: {medium: Memory}}
