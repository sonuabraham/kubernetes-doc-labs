# A privileged Deployment and a plain Pod (Baseline-OK, not Restricted-OK)
apiVersion: apps/v1
kind: Deployment
metadata: {name: priv-deploy}
spec:
  replicas: 1
  selector: {matchLabels: {app: priv}}
  template:
    metadata: {labels: {app: priv}}
    spec:
      containers:
      - name: c
        image: busybox:1.36
        command: ["sleep", "3600"]
        securityContext: {privileged: true}
---
apiVersion: v1
kind: Pod
metadata: {name: plain}
spec:
  containers:
  - {name: c, image: busybox:1.36, command: ["sleep", "3600"]}
