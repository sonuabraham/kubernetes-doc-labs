# NOT applied in this lab (it needs kube-apiserver --admission-control-config-file, i.e. editing the control plane).
# This is the static PodSecurity configuration where cluster-wide defaults and the exemptions from the page live.
apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
- name: PodSecurity
  configuration:
    apiVersion: pod-security.admission.config.k8s.io/v1
    kind: PodSecurityConfiguration
    defaults:                       # applied to namespaces WITHOUT labels
      enforce: "baseline"
      enforce-version: "latest"
      audit: "restricted"
      audit-version: "latest"
      warn: "restricted"
      warn-version: "latest"
    exemptions:
      usernames: []                 # e.g. a trusted CI user (direct Pod creation only!)
      runtimeClasses: ["kata"]      # sandboxed Pods
      namespaces: ["kube-system"]
