# A privileged, hostPID static Pod targeted at a namespace that ENFORCES "restricted".
# Copied to /etc/kubernetes/manifests on the node, the kubelet runs it without asking the API server.
apiVersion: v1
kind: Pod
metadata:
  name: sneaky-static
  namespace: bypass-demo
spec:
  hostPID: true
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "3600"]
    securityContext: {privileged: true}
