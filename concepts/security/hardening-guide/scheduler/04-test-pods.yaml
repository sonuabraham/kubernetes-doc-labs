# Pods the default scheduler would refuse to place; sent to my-scheduler (filters disabled)
apiVersion: v1
kind: Pod
metadata: {name: wrong-node-selector}
spec:
  schedulerName: my-scheduler
  nodeSelector: {disktype: does-not-exist}
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: too-much-cpu}
spec:
  schedulerName: my-scheduler
  containers:
  - {name: c, image: busybox:1.36, command: ["sleep", "3600"], resources: {requests: {cpu: "64"}}}
---
apiVersion: v1
kind: Pod
metadata: {name: same-but-default-scheduler}
spec:
  nodeSelector: {disktype: does-not-exist}
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"]}]
