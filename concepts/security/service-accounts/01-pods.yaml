# api-client: uses pod-reader's projected token to call the API with curl.
# no-token:   default SA, automountServiceAccountToken: false.
apiVersion: v1
kind: Pod
metadata: {name: api-client, namespace: sa-demo}
spec:
  serviceAccountName: pod-reader
  containers:
  - name: c
    image: curlimages/curl:8.10.1
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata: {name: no-token, namespace: sa-demo}
spec:
  automountServiceAccountToken: false
  containers:
  - {name: c, image: busybox:1.36, command: ["sleep", "3600"]}
