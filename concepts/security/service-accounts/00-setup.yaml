# sa-demo: an app ServiceAccount "pod-reader" allowed to list pods in sa-demo AND (cross-namespace) in sa-other
apiVersion: v1
kind: Namespace
metadata: {name: sa-demo}
---
apiVersion: v1
kind: Namespace
metadata: {name: sa-other}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: pod-reader, namespace: sa-demo}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: pod-reader, namespace: sa-demo}
rules:
- {apiGroups: [""], resources: ["pods"], verbs: ["get", "list"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: pod-reader, namespace: sa-demo}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: pod-reader}
subjects: [{kind: ServiceAccount, name: pod-reader, namespace: sa-demo}]
---
# Cross-namespace: a RoleBinding in sa-other naming the ServiceAccount from sa-demo
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: sa-demo-pod-reader, namespace: sa-other}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects: [{kind: ServiceAccount, name: pod-reader, namespace: sa-demo}]
