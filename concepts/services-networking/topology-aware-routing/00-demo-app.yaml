# Topology Aware Routing lab (namespace tar-demo): a Service with the
# service.kubernetes.io/topology-mode: Auto annotation and 3 endpoints.
apiVersion: v1
kind: Namespace
metadata: {name: tar-demo}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: tar-demo}
spec:
  replicas: 3
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
      - name: web
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args: ["netexec", "--http-port=8080"]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: tar-demo
  annotations:
    service.kubernetes.io/topology-mode: Auto
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 8080}]
