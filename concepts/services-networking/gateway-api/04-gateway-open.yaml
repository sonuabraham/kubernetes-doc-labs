# Lab 4+: Same Gateway, but the listener has NO hostname, so it accepts any
# Host. From now on the HTTPRoutes decide which hostnames they serve.
# (kubectl apply updates the Gateway in place - the address does not change.)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
  namespace: example-namespace
spec:
  gatewayClassName: example-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
