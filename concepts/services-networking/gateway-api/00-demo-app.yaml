---
# The docs' GRPCRoute matches service "com.example", method "Login".
# This .proto defines exactly that (package com, service example -> /com.example/Login)
# so grpcurl can call it without server reflection.
apiVersion: v1
kind: ConfigMap
metadata:
  name: login-proto
  namespace: example-namespace
data:
  login.proto: |
    syntax = "proto3";
    package com;
    message LoginRequest { string user = 1; }
    message LoginReply   { string token = 1; }
    service example { rpc Login(LoginRequest) returns (LoginReply); }
---
apiVersion: v1
kind: Pod
metadata:
  name: grpc-client
  namespace: example-namespace
spec:
  containers:
  - name: grpcurl
    image: fullstorydev/grpcurl:v1.9.3-alpine
    command: ["sleep", "infinity"]
    volumeMounts:
    - {name: protos, mountPath: /protos}
  volumes:
  - name: protos
    configMap: {name: login-proto}
