# Lab 4: "Expressive" - matching on path, headers, query params and method,
# things Ingress needed controller annotations for.
#
# Inside ONE match all conditions are ANDed; separate entries in matches[] are ORed.
# Precedence between rules (Gateway API spec, highest first):
#   1. Exact path  2. longest PathPrefix  3. method match  4. most header matches
#   5. most query-param matches   (then oldest route, then name)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matching
  namespace: example-namespace
spec:
  parentRefs:
  - name: example-gateway
  hostnames:
  - "match.example.com"
  rules:
  # A. Exact path  -> service2
  - matches:
    - path: {type: Exact, value: /foo}
    backendRefs:
    - {name: service2, port: 80}
  # B. PathPrefix /foo  -> service1   (/foo/..., but not /foobar)
  - matches:
    - path: {type: PathPrefix, value: /foo}
    backendRefs:
    - {name: service1, port: 80}
  # C. header env: canary  (AND path prefix /)  -> service1-canary
  - matches:
    - path: {type: PathPrefix, value: /}
      headers:
      - {name: env, value: canary}
    backendRefs:
    - {name: service1-canary, port: 80}
  # D. query param ?version=2  OR  method DELETE  -> service2
  - matches:
    - queryParams:
      - {name: version, value: "2"}
    - method: DELETE
    backendRefs:
    - {name: service2, port: 80}
  # E. regular expression path (Extended support - implementation-specific)
  - matches:
    - path: {type: RegularExpression, value: "/users/[0-9]+"}
    backendRefs:
    - {name: example-svc, port: 8080}
  # F. catch-all  -> example-svc  (a rule with no matches = PathPrefix /)
  - backendRefs:
    - {name: example-svc, port: 8080}
