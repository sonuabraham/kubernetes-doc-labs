# Lab 6: Traffic weighting (canary / blue-green) - "traffic weighting" from the
# design principles. Weights are relative: 80 + 20 -> 80% / 20%.
# Change the weights and re-apply to shift traffic gradually; weight 0 = no traffic.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary
  namespace: example-namespace
spec:
  parentRefs:
  - name: example-gateway
  hostnames:
  - "canary.example.com"
  rules:
  - backendRefs:
    - name: service1
      port: 80
      weight: 80
    - name: service1-canary
      port: 80
      weight: 20
