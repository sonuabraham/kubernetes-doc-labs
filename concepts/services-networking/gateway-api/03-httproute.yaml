# Lab 3: HTTPRoute - VERBATIM from the docs (no namespace in metadata, so apply
# it with -n example-namespace: it must sit next to the Gateway because the
# Gateway only allows routes from the Same namespace).
# Host www.example.com + path prefix /login -> Service example-svc port 8080.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-httproute
spec:
  parentRefs:
  - name: example-gateway
  hostnames:
  - "www.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /login
    backendRefs:
    - name: example-svc
      port: 8080
