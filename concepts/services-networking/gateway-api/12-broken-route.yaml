# Lab 12: Read route status to debug. This route has two mistakes:
#   1. parentRefs points at a Gateway that does not exist
#   2. backendRefs points at a Service that does not exist
# Gateway API reports both in status.parents[].conditions (Accepted / ResolvedRefs).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: broken
  namespace: example-namespace
spec:
  parentRefs:
  - name: example-gateway
  - name: no-such-gateway
  hostnames: ["broken.example.com"]
  rules:
  - backendRefs:
    - {name: no-such-svc, port: 80}
