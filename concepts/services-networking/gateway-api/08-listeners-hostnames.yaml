# Lab 8: Several listeners + hostname intersection.
#  - listener "http"      : any host
#  - listener "wildcard"  : *.apps.example.com, same port 80
# An HTTPRoute can target ONE listener with parentRefs[].sectionName.
# The effective hostnames are the INTERSECTION of listener hostname and route
# hostnames: a route for foo.other.com attached to "wildcard" serves nothing.
# Wildcard *.apps.example.com matches one OR MORE labels (a.apps.example.com,
# a.b.apps.example.com) but not apps.example.com itself.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
  namespace: example-namespace
spec:
  gatewayClassName: example-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces: {from: Same}
  - name: wildcard
    protocol: HTTP
    port: 80
    hostname: "*.apps.example.com"
    allowedRoutes:
      namespaces: {from: Same}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apps-route
  namespace: example-namespace
spec:
  parentRefs:
  - name: example-gateway
    sectionName: wildcard          # attach to that listener only
  hostnames:
  - "shop.apps.example.com"        # inside the wildcard  -> served
  - "foo.other.com"                # outside the wildcard -> ignored
  rules:
  - backendRefs:
    - {name: service2, port: 80}
