# Lab 2: Gateway - VERBATIM from the docs.
# Listens for HTTP on port 80, only for Host www.example.com, and only accepts
# Routes from its own namespace (allowedRoutes from: Same, also the default).
# No spec.addresses -> the controller assigns an address (status.addresses).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
  namespace: example-namespace
spec:
  gatewayClassName: example-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: "www.example.com"
    allowedRoutes:
      namespaces:
        from: Same
