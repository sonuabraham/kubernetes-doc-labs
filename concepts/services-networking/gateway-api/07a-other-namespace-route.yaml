# Lab 7a: A team in ANOTHER namespace tries to attach a route to the shared Gateway.
# With allowedRoutes.from: Same the Gateway refuses it:
#   status.parents[].conditions Accepted=False  reason NotAllowedByListeners
# The backend (service1) is also in another namespace (example-namespace), which
# needs a ReferenceGrant (Lab 7c) - until then ResolvedRefs=False RefNotPermitted.
apiVersion: v1
kind: Namespace
metadata:
  name: team-a
  labels:
    shared-gateway-access: "true"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: team-a-route
  namespace: team-a
spec:
  parentRefs:
  - name: example-gateway
    namespace: example-namespace        # cross-namespace parentRef
  hostnames:
  - "team-a.example.com"
  rules:
  - backendRefs:
    - name: service1
      namespace: example-namespace      # cross-namespace backendRef
      port: 80
