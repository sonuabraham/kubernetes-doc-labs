# Lab 7b: Cluster operator opens the listener to namespaces carrying the label
# shared-gateway-access=true.  Options for from:  Same (default) | All | Selector
# This is the Gateway's half of the "bidirectional trust": the route names the
# Gateway (parentRefs) AND the Gateway must allow the route's namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
  namespace: example-namespace
spec:
  gatewayClassName: example-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            shared-gateway-access: "true"
      kinds:
      - kind: HTTPRoute            # optionally restrict route kinds too
