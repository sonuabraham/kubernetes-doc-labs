# A Windows web app + Service as you would deploy it on a mixed Linux/Windows
# cluster. On minikube (Linux only) the pods stay Pending - which is exactly
# what the nodeSelector is for: never land a Windows image on a Linux node.
apiVersion: v1
kind: Namespace
metadata: {name: win-demo}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: iis, namespace: win-demo}
spec:
  replicas: 2
  selector: {matchLabels: {app: iis}}
  template:
    metadata: {labels: {app: iis}}
    spec:
      os: {name: windows}
      nodeSelector:
        kubernetes.io/os: windows
      containers:
      - name: iis
        image: mcr.microsoft.com/windows/servercore/iis:windowsservercore-ltsc2022
        ports: [{containerPort: 80}]
---
# Supported on Windows: ClusterIP, NodePort, LoadBalancer, ExternalName.
# sessionAffinity ClientIP needs Windows Server 2022; externalTrafficPolicy
# Local (client IP preservation) needs DSR or 2019+.
apiVersion: v1
kind: Service
metadata: {name: iis, namespace: win-demo}
spec:
  type: NodePort
  selector: {app: iis}
  sessionAffinity: ClientIP
  externalTrafficPolicy: Local
  ports: [{port: 80}]
