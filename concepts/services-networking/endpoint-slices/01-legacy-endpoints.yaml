# Lab 5: EndpointSlice MIRRORING (deprecated since v1.33): a selector-less
# Service + a legacy Endpoints object -> the mirroring controller creates a
# matching EndpointSlice for you.
apiVersion: v1
kind: Service
metadata: {name: legacy, namespace: eps-demo}
spec:
  ports: [{name: http, port: 80}]
---
apiVersion: v1
kind: Endpoints
metadata: {name: legacy, namespace: eps-demo}
subsets:
- addresses: [{ip: 10.9.9.9}, {ip: 10.9.9.10}]
  ports: [{name: http, port: 80}]
