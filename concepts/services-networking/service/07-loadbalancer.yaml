# Lab 7: LoadBalancer - asks the cloud provider (or MetalLB, minikube tunnel,
# kind cloud-provider-kind ...) for an external load balancer.
# Builds on NodePort + ClusterIP. The external address shows up
# asynchronously in .status.loadBalancer.ingress.
apiVersion: v1
kind: Service
metadata:
  name: my-lb
  namespace: svc-demo
  # Internal (private) LB is requested with a provider annotation, e.g.:
  #   GKE:   networking.gke.io/load-balancer-type: "Internal"
  #   AWS:   service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
  #   Azure: service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: MyApp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9376
  # allocateLoadBalancerNodePorts: false   # skip NodePorts if your LB routes
  #                                        # straight to pods (stable v1.24)
  # loadBalancerClass: example.com/my-lb   # non-default LB implementation;
  #                                        # immutable once set (stable v1.24)
  # loadBalancerIP: ...                    # DEPRECATED since v1.24
