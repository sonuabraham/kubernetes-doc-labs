# Lab 11: Traffic policies (values: Cluster | Local)
#
# internalTrafficPolicy  - traffic from inside the cluster (to the cluster IP)
#   Cluster (default): any ready endpoint
#   Local:             only endpoints on the SAME node as the client;
#                      if there are none, the traffic is DROPPED
#
# externalTrafficPolicy  - traffic arriving via NodePort / LoadBalancer
#   Cluster (default): any endpoint; may take an extra hop, source IP is SNATed
#   Local:             only node-local endpoints; preserves client source IP;
#                      nodes without a local pod don't answer
#
# Needs a multi-node cluster to see the difference (minikube --nodes=2).
apiVersion: v1
kind: Service
metadata:
  name: my-local-internal
  namespace: svc-demo
spec:
  selector:
    app.kubernetes.io/name: MyApp
  ports:
    - port: 80
      targetPort: 9376
  internalTrafficPolicy: Local
---
apiVersion: v1
kind: Service
metadata:
  name: my-local-external
  namespace: svc-demo
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: MyApp
  ports:
    - port: 80
      targetPort: 9376
      nodePort: 30008
  externalTrafficPolicy: Local
