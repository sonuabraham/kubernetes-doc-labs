# Demo app used by every lab.
#
#   namespace svc-demo:
#     Deployment "web"  (3 replicas, label app.kubernetes.io/name=MyApp)
#        agnhost netexec -> HTTP on 9376  (GET /hostname returns the pod name)
#                        -> UDP  on 9377  (send "hostname" to get the pod name)
#     Pod "client"      (netshoot: curl, dig, nslookup, nc) - used to run tests
#
# Port 9376 matches the targetPort used in the docs examples.
apiVersion: v1
kind: Namespace
metadata:
  name: svc-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: svc-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: MyApp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: MyApp
    spec:
      containers:
      - name: agnhost
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args: ["netexec", "--http-port=9376", "--udp-port=9377"]
        ports:
        - name: http-web          # named port, used by Lab 2b
          containerPort: 9376
          protocol: TCP
        - name: udp-echo
          containerPort: 9377
          protocol: UDP
---
# Test client. It is created BEFORE any Service exists, so it will NOT get
# the {SVCNAME}_SERVICE_HOST env vars. Lab 4 shows why that matters.
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: svc-demo
spec:
  containers:
  - name: netshoot
    image: nicolaka/netshoot:v0.13
    command: ["sleep", "infinity"]
