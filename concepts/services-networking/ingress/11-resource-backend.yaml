# Lab 11 (read-only): Resource backend - an ObjectRef to a custom resource
# in the same namespace (e.g. an object-storage bucket for static files)
# instead of a Service. "resource" and "service" are mutually exclusive.
# Kubernetes doesn't check that StorageBucket exists. The class below has
# no controller, so nothing tries to serve this; it's for kubectl describe.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-resource-backend
  namespace: ingress-demo
spec:
  ingressClassName: not-served
  defaultBackend:
    resource:
      apiGroup: k8s.example.com
      kind: StorageBucket
      name: static-assets
  rules:
    - http:
        paths:
          - path: /icons
            pathType: ImplementationSpecific   # matching is up to the controller
            backend:
              resource:
                apiGroup: k8s.example.com
                kind: StorageBucket
                name: icon-assets
