# Lab 4: Exact host vs wildcard host (docs example).
#   foo.bar.com      matches only Host: foo.bar.com
#   *.foo.com        matches ONE extra label: bar.foo.com yes,
#                    baz.bar.foo.com no, foo.com no
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-wildcard-host
  namespace: ingress-demo
spec:
  ingressClassName: nginx
  rules:
  - host: "foo.bar.com"
    http:
      paths:
      - pathType: Prefix
        path: "/bar"
        backend:
          service:
            name: service1
            port:
              number: 80
  - host: "*.foo.com"
    http:
      paths:
      - pathType: Prefix
        path: "/foo"
        backend:
          service:
            name: service2
            port:
              number: 80
