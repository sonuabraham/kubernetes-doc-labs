# Lab 10: Updating an Ingress - after adding host bar.baz.com.
# Apply with: kubectl replace -f 10b-update-after.yaml  (or kubectl edit)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test
  namespace: ingress-demo
spec:
  ingressClassName: nginx
  rules:
  - host: foo.bar.com
    http:
      paths:
      - backend:
          service:
            name: service1
            port:
              number: 80
        path: /foo
        pathType: Prefix
  - host: bar.baz.com            # <- new
    http:
      paths:
      - backend:
          service:
            name: service2
            port:
              number: 80
        path: /foo
        pathType: Prefix
