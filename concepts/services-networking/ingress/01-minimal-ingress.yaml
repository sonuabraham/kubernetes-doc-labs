# Lab 1: The minimal Ingress from the docs.
# No host -> applies to every request that reaches the controller's IP.
# /testpath (Prefix) -> Service "test" port 80.
# Docs use ingressClassName: nginx-example; minikube's controller class is "nginx".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minimal-ingress
  namespace: ingress-demo
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /testpath
        pathType: Prefix          # required - no pathType fails validation
        backend:
          service:
            name: test
            port:
              number: 80          # or  port: { name: http }
