          httpGet:
            path: /
            port: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: service2
  namespace: ingress-demo
spec:
  selector:
    app: service2
  ports:
    - name: http
      port: 80
      targetPort: 5678
    - name: alt
      port: 8080
      targetPort: 5678
---
apiVersion: apps/v1
