# Network-model tour (namespace netmodel-demo):
#   server : agnhost netexec - /clientip returns the source IP:port it sees
#   client : busybox, used to call the server directly and via the Service
apiVersion: v1
kind: Namespace
metadata: {name: netmodel-demo}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: server, namespace: netmodel-demo}
spec:
  replicas: 2
  selector: {matchLabels: {app: server}}
  template:
    metadata: {labels: {app: server}}
    spec:
      containers:
      - name: netexec
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args: ["netexec", "--http-port=8080"]
---
apiVersion: v1
kind: Service
metadata: {name: server, namespace: netmodel-demo}
spec:
  selector: {app: server}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Pod
metadata: {name: client, namespace: netmodel-demo}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "infinity"]}]
