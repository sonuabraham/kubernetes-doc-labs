# Lab 9: Port ranges with endPort (stable since v1.25).
# Allows egress from db to 10.0.0.0/24 on TCP ports 32000-32768.
# Rules: endPort >= port, port must be set, both numeric.
# If your CNI doesn't support endPort, only "port" is applied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: multi-port-egress
  namespace: np-demo
spec:
  podSelector:
    matchLabels:
      role: db
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 10.0.0.0/24
    ports:
    - protocol: TCP
      port: 32000
      endPort: 32768
