# Lab 3: Allow backend -> db, but only on TCP port 80.
# A rule matches only if BOTH "from" and "ports" match.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-db
  namespace: np-demo
spec:
  podSelector:
    matchLabels:
      app: db
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 80
# Experiment: change port 80 to 5432, re-apply, and backend -> db stops working.
