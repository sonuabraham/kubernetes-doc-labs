# Demo app used by every lab.
#
#   namespace np-demo:  frontend  -->  backend  -->  db
#   namespace other:    outsider   (a pod in a different namespace)
#
# All pods run nginx (listens on port 80, and the image ships with curl),
# so any pod can act as both a client and a server.
apiVersion: v1
kind: Namespace
metadata:
  name: np-demo
---
apiVersion: v1
kind: Namespace
metadata:
  name: other
  labels:
    team: partner          # used by the namespaceSelector labs
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: np-demo
  labels:
    app: frontend
    role: client
spec:
  containers:
  - name: nginx
    image: nginx:1.27
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: backend
  namespace: np-demo
  labels:
    app: backend
spec:
  containers:
  - name: nginx
    image: nginx:1.27
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: db
  namespace: np-demo
  labels:
    app: db
    role: db
spec:
  containers:
  - name: nginx
    image: nginx:1.27
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: outsider
  namespace: other
  labels:
    app: outsider
    role: client
spec:
  containers:
  - name: nginx
    image: nginx:1.27
    ports:
    - containerPort: 80
---
# Services give each server pod a stable DNS name, e.g. backend.np-demo
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: np-demo
spec:
  selector:
    app: frontend
  ports:
  - port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: np-demo
spec:
  selector:
    app: backend
  ports:
  - port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: np-demo
spec:
  selector:
    app: db
  ports:
  - port: 80
