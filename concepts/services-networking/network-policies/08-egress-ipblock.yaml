# Lab 8: ipBlock - allow frontend to reach one external IP on HTTPS.
# ipBlock is meant for addresses OUTSIDE the cluster (pod IPs change).
# 1.1.1.1 and 1.0.0.1 are both Cloudflare DNS servers that answer HTTPS,
# so they make good test targets.
#   Allowed: https://1.1.1.1      Blocked: https://1.0.0.1
#
# Experiment with "except" - replace the ipBlock with:
#     ipBlock:
#       cidr: 1.0.0.0/8
#       except:
#       - 1.1.1.1/32
# and the result flips: 1.0.0.1 allowed, 1.1.1.1 blocked.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-egress-external
  namespace: np-demo
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 1.1.1.1/32
    ports:
    - protocol: TCP
      port: 443
