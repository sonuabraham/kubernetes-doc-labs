# Lab 2/3: three Ingresses, three different classes.
#   toy-blue  : ingressClassName toy   -> handled by toy-controller.sh
#   nginx-green: ingressClassName nginx -> handled by minikube's ingress-nginx addon (if enabled)
#   orphan    : ingressClassName nobody -> no controller -> nothing happens, no ADDRESS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: toy-blue, namespace: ingressctl-demo}
spec:
  ingressClassName: toy
  rules:
  - host: blue.example.com
    http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: blue, port: {number: 80}}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: toy-green, namespace: ingressctl-demo}
spec:
  ingressClassName: toy
  rules:
  - host: green.example.com
    http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: green, port: {number: 80}}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: orphan, namespace: ingressctl-demo}
spec:
  ingressClassName: nobody
  rules:
  - host: lost.example.com
    http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: blue, port: {number: 80}}}}
