# The docs' example: "a service named foo that exposes a set of Pods, each
# running a container named bar". Created BEFORE the client pod, so the client
# gets FOO_SERVICE_HOST / FOO_SERVICE_PORT environment variables.
apiVersion: v1
kind: Namespace
metadata:
  name: env-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foo
  namespace: env-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: foo}
  template:
    metadata:
      labels: {app: foo}
    spec:
      containers:
      - name: bar
        image: nginx:1.27
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: foo
  namespace: env-demo
spec:
  selector: {app: foo}
  ports: [{name: http, port: 8080, targetPort: 80}]
