# A private, password-protected registry INSIDE the cluster, for the
# imagePullSecrets labs. hostNetwork: true -> it listens on the node's
# localhost:5000, so the node's containerd can pull "localhost:5000/..." images
# (containerd allows plain HTTP for localhost registries).
# Login: student / s3cret  (htpasswd generated by the init container)
apiVersion: v1
kind: Namespace
metadata:
  name: images-demo
---
apiVersion: v1
kind: Pod
metadata:
  name: registry
  namespace: images-demo
  labels: {app: registry}
spec:
  hostNetwork: true
  initContainers:
  - name: htpasswd
    image: httpd:2.4-alpine
    command: ["sh", "-c", "htpasswd -Bbn student s3cret > /auth/htpasswd"]
    volumeMounts: [{name: auth, mountPath: /auth}]
  containers:
  - name: registry
    image: registry:2.8.3
    env:
    - {name: REGISTRY_AUTH, value: htpasswd}
    - {name: REGISTRY_AUTH_HTPASSWD_REALM, value: "Lab Registry"}
    - {name: REGISTRY_AUTH_HTPASSWD_PATH, value: /auth/htpasswd}
    - {name: REGISTRY_HTTP_ADDR, value: "127.0.0.1:5000"}
    volumeMounts: [{name: auth, mountPath: /auth}]
  volumes:
  - name: auth
    emptyDir: {}
