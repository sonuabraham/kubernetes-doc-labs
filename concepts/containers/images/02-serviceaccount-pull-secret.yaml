# Lab 6: imagePullSecrets on a ServiceAccount - every Pod using this SA gets
# the secret injected automatically (no imagePullSecrets in the Pod spec).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: puller
  namespace: images-demo
imagePullSecrets:
- name: lab-registry
---
apiVersion: v1
kind: Pod
metadata:
  name: via-serviceaccount
  namespace: images-demo
spec:
  serviceAccountName: puller
  containers:
  - name: c
    image: localhost:5000/private/busybox:1.0
    command: ["sleep", "3600"]
