# The docs' Pod (name, runtimeClassName VERBATIM); the "# ..." part is filled
# with one container so it can run. Namespace: apply with -n runtimeclass-demo.
apiVersion: v1
kind: Pod
metadata:
  name: mypod
spec:
  runtimeClassName: myclass
  # ...
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "3600"]
