# Lab 4/5: RuntimeClass "scheduling" and "overhead".
#  - scheduling.nodeSelector is MERGED into every pod that uses the class
#  - scheduling.tolerations are MERGED (union) too
#  - overhead.podFixed is added to the pod (spec.overhead) and counted by the scheduler
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: sandboxed
handler: myconfiguration
scheduling:
  nodeSelector:
    runtime.example.com/sandbox: "true"
  tolerations:
  - key: runtime.example.com/sandbox-only
    operator: Exists
    effect: NoSchedule
overhead:
  podFixed:
    cpu: 250m
    memory: 120Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: sandboxed-pod
  namespace: runtimeclass-demo
spec:
  runtimeClassName: sandboxed
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests: {cpu: 100m, memory: 64Mi}
      limits:   {cpu: 100m, memory: 64Mi}
