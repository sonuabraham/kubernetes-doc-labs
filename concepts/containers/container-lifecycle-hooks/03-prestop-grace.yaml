# Lab 4: the docs' grace-period arithmetic, scaled down 6x.
# Docs: grace 60s, hook 55s, app needs 10s after TERM -> killed (55+10 > 60).
# Here: grace 10s, preStop hook 8s, app needs ~5s after TERM -> SIGKILLed at 10s.
apiVersion: v1
kind: Pod
metadata:
  name: prestop-slow
  namespace: hooks-demo
spec:
  terminationGracePeriodSeconds: 10
  containers:
  - name: c
    image: busybox:1.36
    command: ["sh", "-c", "trap 'echo got TERM at $(date +%T); sleep 5; echo clean exit; exit 0' TERM; echo started; while true; do sleep 1; done"]
    lifecycle:
      preStop:
        exec:
          command: ["sh", "-c", "sleep 8"]
