# Two side experiments that run on the real (Linux) minikube node:
# 1) a RuntimeClass whose handler is the docs' placeholder - the node's containerd has no such handler.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: placeholder-handler
handler: example-container-runtime-handler
---
apiVersion: v1
kind: Pod
metadata:
  name: handler-test
  namespace: win-guide
spec:
  runtimeClassName: placeholder-handler
  containers:
  - {name: c, image: busybox:1.36, command: [sleep, "3600"]}
---
# 2) the docs' webserver command writes $$listener: Kubernetes turns $$ into a literal $ (and expands $(VAR)).
apiVersion: v1
kind: Pod
metadata:
  name: dollar
  namespace: win-guide
spec:
  restartPolicy: Never
  os: {name: linux}
  containers:
  - name: c
    image: busybox:1.36
    env: [{name: GREETING, value: hello}]
    command: [sh, -c, "x=world ; echo 'GREETING=$(GREETING) x=$$x literal=$$(GREETING) unknown=$(NOPE)'"]
