# An ordinary "Linux" workload from before Windows nodes existed: no spec.os, no nodeSelector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linux-app
  namespace: win-guide
spec:
  replicas: 6
  selector:
    matchLabels: {app: linux-app}
  template:
    metadata:
      labels: {app: linux-app}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: [sleep, "3600"]
        resources:
          requests: {cpu: 50m, memory: 16Mi}
