# A Pod that declares Windows but is bound straight to the Linux node (nodeName skips the scheduler).
# The API accepts it; the kubelet's admission rejects it.
apiVersion: v1
kind: Pod
metadata:
  name: wrong-os
  namespace: win-intro
spec:
  os: {name: windows}
  nodeName: minikube
  containers:
  - name: c
    image: busybox:1.36
    command: [sleep, "3600"]
