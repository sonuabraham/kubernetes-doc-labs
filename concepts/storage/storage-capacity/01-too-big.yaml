# Lab 1: a 2Ti claim when the driver reports 1Ti for the node
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: too-big-claim, namespace: cap-demo}
spec: {storageClassName: csi-hostpath-wffc, accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 2Ti}}}
---
apiVersion: v1
kind: Pod
metadata: {name: too-big, namespace: cap-demo}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep","3600"], volumeMounts: [{name: v, mountPath: /v}]}]
  volumes: [{name: v, persistentVolumeClaim: {claimName: too-big-claim}}]
