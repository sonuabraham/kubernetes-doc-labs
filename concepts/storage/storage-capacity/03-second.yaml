# Lab 2: another 600Gi - fit before the first one was provisioned, not after
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: second-claim, namespace: cap-demo}
spec: {storageClassName: csi-hostpath-wffc, accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 600Gi}}}
---
apiVersion: v1
kind: Pod
metadata: {name: second, namespace: cap-demo}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep","3600"], volumeMounts: [{name: v, mountPath: /v}]}]
  volumes: [{name: v, persistentVolumeClaim: {claimName: second-claim}}]
