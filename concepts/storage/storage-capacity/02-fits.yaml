# Lab 2: a 600Gi claim - fits
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: fits-claim, namespace: cap-demo}
spec: {storageClassName: csi-hostpath-wffc, accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 600Gi}}}
---
apiVersion: v1
kind: Pod
metadata: {name: fits, namespace: cap-demo}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep","3600"], volumeMounts: [{name: v, mountPath: /v}]}]
  volumes: [{name: v, persistentVolumeClaim: {claimName: fits-claim}}]
