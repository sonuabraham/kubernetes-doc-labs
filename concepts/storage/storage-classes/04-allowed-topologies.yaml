# Lab 4: allowedTopologies on a real driver. hostpath.csi.k8s.io publishes topology key
# topology.hostpath.csi/node (see the node's labels). This class only allows a node that doesn't exist.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: csi-only-node-x
provisioner: hostpath.csi.k8s.io
volumeBindingMode: WaitForFirstConsumer
allowedTopologies:
- matchLabelExpressions:
  - key: topology.hostpath.csi/node
    values:
    - node-x
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: topo-claim, namespace: sc-demo}
spec:
  storageClassName: csi-only-node-x
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Pod
metadata: {name: topo-pod, namespace: sc-demo}
spec:
  containers:
  - {name: c, image: busybox:1.36, command: ["sleep", "3600"], volumeMounts: [{name: v, mountPath: /v}]}
  volumes:
  - {name: v, persistentVolumeClaim: {claimName: topo-claim}}
