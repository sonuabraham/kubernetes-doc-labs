# Lab 3: the docs' warning - nodeName bypasses the scheduler, so a WaitForFirstConsumer claim is never bound
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: nodename-claim}
spec:
  storageClassName: csi-wffc-retain
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Pod
metadata: {name: nodename-pod}
spec:
  nodeName: minikube
  containers:
  - {name: c, image: busybox:1.36, command: ["sleep", "3600"], volumeMounts: [{name: v, mountPath: /v}]}
  volumes:
  - {name: v, persistentVolumeClaim: {claimName: nodename-claim}}
