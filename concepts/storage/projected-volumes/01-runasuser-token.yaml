# "SecurityContext interactions" (Linux): when the Pod sets runAsUser (and all containers agree),
# the projected serviceAccountToken file is owned by that user with mode 0600.
# Same Pod without runAsUser for comparison.
apiVersion: v1
kind: Pod
metadata:
  name: token-runas
  namespace: proj-demo
spec:
  securityContext:
    runAsUser: 1000
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts:
    - {name: token-vol, mountPath: /service-account, readOnly: true}
  volumes:
  - name: token-vol
    projected:
      sources:
      - serviceAccountToken: {path: token, expirationSeconds: 3600}
      - configMap: {name: myconfigmap}
---
apiVersion: v1
kind: Pod
metadata:
  name: token-root
  namespace: proj-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts:
    - {name: token-vol, mountPath: /service-account, readOnly: true}
  volumes:
  - name: token-vol
    projected:
      sources:
      - serviceAccountToken: {path: token, expirationSeconds: 3600}
      - configMap: {name: myconfigmap}
