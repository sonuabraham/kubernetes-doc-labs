# The docs' frontend Pod with real images and the same resources/volume, plus a writer:
# "app" fills the shared emptyDir (sizeLimit 500Mi) with 600Mi -> the kubelet evicts the Pod.
apiVersion: v1
kind: Pod
metadata:
  name: frontend-runnable
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 5; dd if=/dev/zero of=/tmp/big bs=1M count=600; echo wrote 600Mi; sleep 3600"]
    resources:
      requests:
        ephemeral-storage: "2Gi"
      limits:
        ephemeral-storage: "4Gi"
    volumeMounts:
    - name: ephemeral
      mountPath: "/tmp"
  - name: log-aggregator
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests:
        ephemeral-storage: "2Gi"
      limits:
        ephemeral-storage: "4Gi"
    volumeMounts:
    - name: ephemeral
      mountPath: "/tmp"
  volumes:
    - name: ephemeral
      emptyDir:
        sizeLimit: 500Mi
