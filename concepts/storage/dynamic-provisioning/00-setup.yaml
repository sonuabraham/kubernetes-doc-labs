# Namespace + working equivalents of the docs' slow/fast classes on minikube's csi-hostpath-driver addon
# (the docs' kubernetes.io/gce-pd only works on Google Cloud). The parameters are illustrative only:
# the hostpath driver ignores unknown parameters.
apiVersion: v1
kind: Namespace
metadata: {name: dp-demo}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: slow-hostpath
provisioner: hostpath.csi.k8s.io
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-hostpath
provisioner: hostpath.csi.k8s.io
volumeBindingMode: WaitForFirstConsumer
