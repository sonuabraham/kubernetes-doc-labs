# "PersistentVolumeClaim naming": the generated claim is <pod name>-<volume name>.
# Pod "pod-a" + volume "scratch" and Pod "pod" + volume "a-scratch" both want a PVC called "pod-a-scratch".
apiVersion: v1
kind: Pod
metadata: {name: pod-a}
spec:
  containers:
  - {name: c, image: busybox:1.36, command: ["sleep", "3600"], volumeMounts: [{name: scratch, mountPath: /scratch}]}
  volumes:
  - name: scratch
    ephemeral:
      volumeClaimTemplate:
        spec: {accessModes: ["ReadWriteOnce"], storageClassName: scratch-storage-class, resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Pod
metadata: {name: pod}
spec:
  containers:
  - {name: c, image: busybox:1.36, command: ["sleep", "3600"], volumeMounts: [{name: a-scratch, mountPath: /scratch}]}
  volumes:
  - name: a-scratch
    ephemeral:
      volumeClaimTemplate:
        spec: {accessModes: ["ReadWriteOnce"], storageClassName: scratch-storage-class, resources: {requests: {storage: 1Gi}}}
