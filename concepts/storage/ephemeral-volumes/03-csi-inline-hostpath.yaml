# The docs' CSI inline volume, but with a driver that is installed AND declares the Ephemeral lifecycle mode:
# hostpath.csi.k8s.io (kubectl get csidriver -> MODES [Persistent Ephemeral]).
kind: Pod
apiVersion: v1
metadata:
  name: my-csi-app-hostpath
spec:
  containers:
    - name: my-frontend
      image: busybox:1.28
      volumeMounts:
      - mountPath: "/data"
        name: my-csi-inline-vol
      command: [ "sleep", "1000000" ]
  volumes:
    - name: my-csi-inline-vol
      csi:
        driver: hostpath.csi.k8s.io
        volumeAttributes:
          foo: bar
