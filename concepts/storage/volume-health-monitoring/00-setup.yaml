# A CSI volume in use by a Pod (volume name "my-volume", as in the docs' status excerpt), to watch health reporting on.
apiVersion: v1
kind: Namespace
metadata: {name: health-demo}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: my-claim, namespace: health-demo}
spec:
  storageClassName: csi-hostpath-sc
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Pod
metadata: {name: my-pod, namespace: health-demo}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep","3600"], volumeMounts: [{name: my-volume, mountPath: /data}]}]
  volumes: [{name: my-volume, persistentVolumeClaim: {claimName: my-claim}}]
