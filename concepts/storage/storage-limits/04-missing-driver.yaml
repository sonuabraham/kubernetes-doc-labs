# Lab 3: a CSIDriver object whose node plugin runs NOWHERE (no CSINode entry), a static PV for it, and a Pod using it.
# preventPodSchedulingIfMissing decides whether such a Pod is scheduled (and stuck) or kept Pending.
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: absent.csi.example.com
spec:
  attachRequired: false
  preventPodSchedulingIfMissing: false
---
apiVersion: v1
kind: PersistentVolume
metadata: {name: absent-pv}
spec:
  storageClassName: absent
  capacity: {storage: 1Gi}
  accessModes: ["ReadWriteOnce"]
  csi: {driver: absent.csi.example.com, volumeHandle: vol-123}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: absent-claim, namespace: limits-demo}
spec: {storageClassName: absent, accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Pod
metadata: {name: needs-absent-driver, namespace: limits-demo}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep","3600"], volumeMounts: [{name: v, mountPath: /v}]}]
  volumes: [{name: v, persistentVolumeClaim: {claimName: absent-claim}}]
