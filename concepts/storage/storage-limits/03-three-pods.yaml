# Lab 1: three Pods, one hostpath CSI volume each. With CSINode allocatable.count=2 the third can't be placed.
apiVersion: v1
kind: Namespace
metadata: {name: limits-demo}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: vol-1, namespace: limits-demo}
spec: {storageClassName: csi-hostpath-sc, accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Pod
metadata: {name: app-1, namespace: limits-demo}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep","3600"], volumeMounts: [{name: v, mountPath: /v}]}]
  volumes: [{name: v, persistentVolumeClaim: {claimName: vol-1}}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: vol-2, namespace: limits-demo}
spec: {storageClassName: csi-hostpath-sc, accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Pod
metadata: {name: app-2, namespace: limits-demo}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep","3600"], volumeMounts: [{name: v, mountPath: /v}]}]
  volumes: [{name: v, persistentVolumeClaim: {claimName: vol-2}}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: vol-3, namespace: limits-demo}
spec: {storageClassName: csi-hostpath-sc, accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Pod
metadata: {name: app-3, namespace: limits-demo}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep","3600"], volumeMounts: [{name: v, mountPath: /v}]}]
  volumes: [{name: v, persistentVolumeClaim: {claimName: vol-3}}]
