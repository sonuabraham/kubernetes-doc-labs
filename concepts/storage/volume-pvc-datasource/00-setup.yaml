# What the docs' clone-of-pvc-1 needs: namespace myns, StorageClass "cloning" (a CSI driver that can clone),
# and the source claim pvc-1 holding some data. Needs: minikube addons enable csi-hostpath-driver
apiVersion: v1
kind: Namespace
metadata: {name: myns}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: {name: cloning}
provisioner: hostpath.csi.k8s.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: pvc-1, namespace: myns}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: cloning
  resources: {requests: {storage: 5Gi}}
---
# The source stays IN USE while it's cloned
apiVersion: v1
kind: Pod
metadata: {name: source-app, namespace: myns}
spec:
  containers:
  - {name: app, image: busybox:1.36, command: ["sh", "-c", "echo original-data > /data/file; sleep 3600"], volumeMounts: [{name: d, mountPath: /data}]}
  volumes:
  - {name: d, persistentVolumeClaim: {claimName: pvc-1}}
