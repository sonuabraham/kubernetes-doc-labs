# Lab 5: a CSI-provisioned claim in an expandable class, plus a Pod so it's expanded while IN USE.
# fixed-pvc is in the addon's csi-hostpath-sc (allowVolumeExpansion: false).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grow-pvc
  namespace: pv-demo
spec:
  storageClassName: csi-expandable
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fixed-pvc
  namespace: pv-demo
spec:
  storageClassName: csi-hostpath-sc
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: grow-pod
  namespace: pv-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts:
    - {name: data, mountPath: /data}
  volumes:
  - name: data
    persistentVolumeClaim: {claimName: grow-pvc}
