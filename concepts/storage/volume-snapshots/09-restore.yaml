# Provision volumes from snapshots: restore the dynamic snapshot AND the imported one, then read both
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: restored-dynamic, namespace: snap-demo}
spec:
  storageClassName: csi-hostpath-sc
  dataSource: {name: new-snapshot-test, kind: VolumeSnapshot, apiGroup: snapshot.storage.k8s.io}
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: restored-imported, namespace: snap-demo}
spec:
  storageClassName: csi-hostpath-sc
  dataSource: {name: test-snapshot, kind: VolumeSnapshot, apiGroup: snapshot.storage.k8s.io}
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: batch/v1
kind: Job
metadata: {name: read-restored, namespace: snap-demo}
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: r
        image: busybox:1.36
        command: ["sh", "-c", "echo dynamic: $(cat /a/state); echo imported: $(cat /b/state)"]
        volumeMounts: [{name: a, mountPath: /a}, {name: b, mountPath: /b}]
      volumes:
      - {name: a, persistentVolumeClaim: {claimName: restored-dynamic}}
      - {name: b, persistentVolumeClaim: {claimName: restored-imported}}
