# Scope quotas, built from the docs' scopeSelector excerpts:
# BestEffort pods (no requests/limits) capped at 2; Terminating pods (activeDeadlineSeconds set) capped at 1.
apiVersion: v1
kind: ResourceQuota
metadata: {name: besteffort}
spec:
  hard: {pods: "2"}
  scopeSelector:
    matchExpressions:
      - scopeName: BestEffort # Match pods that have best effort quality of service
        operator: Exists # optional; "Exists" is implied for BestEffort scope
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: terminating}
spec:
  hard: {pods: "1"}
  scopes: ["Terminating"]
