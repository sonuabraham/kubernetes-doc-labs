# A richer CRD (not from the page) to try the "Advanced features" table:
# schema validation, defaulting, CEL rules, status + scale subresources, printer columns, short names.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backups.demo.example.com
spec:
  group: demo.example.com
  scope: Namespaced
  names: {plural: backups, singular: backup, kind: Backup, shortNames: [bk], categories: [all]}
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [database]
            x-kubernetes-validations:
            - rule: "self.retainDays >= self.keepLast"
              message: "retainDays must be >= keepLast"
            properties:
              database: {type: string, minLength: 1}
              schedule: {type: string, default: "0 3 * * *"}
              keepLast: {type: integer, minimum: 1, default: 3}
              retainDays: {type: integer, minimum: 1, default: 7}
              tier: {type: string, enum: [bronze, silver, gold], default: bronze}
              workers: {type: integer, minimum: 0, default: 1}
          status:
            type: object
            properties:
              lastRun: {type: string}
              phase: {type: string}
              workers: {type: integer}
              selector: {type: string}
    subresources:
      status: {}
      scale:
        specReplicasPath: .spec.workers
        statusReplicasPath: .status.workers
        labelSelectorPath: .status.selector
    additionalPrinterColumns:
    - {name: DB, type: string, jsonPath: .spec.database}
    - {name: Tier, type: string, jsonPath: .spec.tier}
    - {name: Workers, type: integer, jsonPath: .spec.workers}
    - {name: Phase, type: string, jsonPath: .status.phase}
    - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
