# Namespace cni-demo: a file server WITH the docs' bandwidth annotations (1M each way), the same server
# WITHOUT them, a client to time downloads, and a Pod exposing a hostPort (needs the portmap plugin).
apiVersion: v1
kind: Namespace
metadata: {name: cni-demo}
---
apiVersion: v1
kind: Pod
metadata:
  name: server-limited
  namespace: cni-demo
  annotations:
    kubernetes.io/ingress-bandwidth: 1M
    kubernetes.io/egress-bandwidth: 1M
spec:
  containers:
  - name: httpd
    image: busybox:1.36
    command: [sh, -c, "mkdir /www && dd if=/dev/zero of=/www/2mb bs=1M count=2 2>/dev/null && dd if=/dev/zero of=/www/24mb bs=1M count=24 2>/dev/null && httpd -f -p 8080 -h /www"]
---
apiVersion: v1
kind: Pod
metadata:
  name: server-free
  namespace: cni-demo
spec:
  containers:
  - name: httpd
    image: busybox:1.36
    command: [sh, -c, "mkdir /www && dd if=/dev/zero of=/www/2mb bs=1M count=2 2>/dev/null && dd if=/dev/zero of=/www/24mb bs=1M count=24 2>/dev/null && httpd -f -p 8080 -h /www"]
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: cni-demo
spec:
  containers:
  - {name: c, image: busybox:1.36, command: [sleep, "36000"]}
---
apiVersion: v1
kind: Pod
metadata:
  name: hostport
  namespace: cni-demo
spec:
  containers:
  - name: web
    image: busybox:1.36
    command: [sh, -c, "mkdir /www && echo hello-from-hostport > /www/index.html && httpd -f -p 80 -h /www"]
    ports:
    - {containerPort: 80, hostPort: 8088}
