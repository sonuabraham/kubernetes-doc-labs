# Step 1 of the docs' example: "A custom resource named SampleDB".
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sampledbs.sampledb.example.com
spec:
  group: sampledb.example.com
  scope: Namespaced
  names: {plural: sampledbs, singular: sampledb, kind: SampleDB, shortNames: [sdb]}
  versions:
  - name: v1
    served: true
    storage: true
    subresources: {status: {}}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              version: {type: string, default: "16.4", pattern: '^[0-9]+\.[0-9]+$', description: "postgres version (image tag postgres:<version>-alpine)"}
              storage: {type: string, default: 1Gi}
              backupSchedule: {type: string, default: "*/5 * * * *"}
          status:
            type: object
            properties:
              phase: {type: string}
              version: {type: string, description: "version actually running"}
              readyReplicas: {type: integer}
              observedGeneration: {type: integer}
    additionalPrinterColumns:
    - {name: Wanted, type: string, jsonPath: .spec.version}
    - {name: Running, type: string, jsonPath: .status.version}
    - {name: Phase, type: string, jsonPath: .status.phase}
    - {name: Ready, type: integer, jsonPath: .status.readyReplicas}
    - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
