# What the declared feature RestartAllContainersOnContainerExits does: main exits 42 -> the WHOLE Pod's containers
# restart in place (the sidecar too). Counts runs in an emptyDir that survives the in-place restart.
apiVersion: v1
kind: Pod
metadata: {name: restart-all}
spec:
  nodeName: minikube
  restartPolicy: Never
  volumes: [{name: state, emptyDir: {}}]
  containers:
  - name: main
    image: busybox:1.36
    restartPolicy: Never
    restartPolicyRules:
    - action: RestartAllContainers
      exitCodes: {operator: In, values: [42]}
    command: ["sh", "-c", "n=$(cat /s/runs 2>/dev/null || echo 0); n=$((n+1)); echo $n > /s/runs; echo run $n; [ $n -lt 3 ] && { sleep 3; exit 42; }; sleep 3600"]
    volumeMounts: [{name: state, mountPath: /s}]
  - name: helper
    image: busybox:1.36
    command: ["sh", "-c", "echo helper started at $(date +%T); sleep 3600"]
