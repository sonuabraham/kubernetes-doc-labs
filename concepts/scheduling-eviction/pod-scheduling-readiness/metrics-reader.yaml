# Identity allowed to read the scheduler's /metrics (it listens on 127.0.0.1:10259 inside the node)
apiVersion: v1
kind: ServiceAccount
metadata: {name: metrics-reader, namespace: gate-demo}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: gate-demo-metrics-reader}
rules: [{nonResourceURLs: ["/metrics"], verbs: ["get"]}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: gate-demo-metrics-reader}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: gate-demo-metrics-reader}
subjects: [{kind: ServiceAccount, name: metrics-reader, namespace: gate-demo}]
