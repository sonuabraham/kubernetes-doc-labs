# 3) TWO SEPARATE instances (no shared cache, no coordination): 'indep-a' and 'indep-b'
---
apiVersion: v1
kind: ConfigMap
metadata: {name: indep-a, namespace: multi-sched}
data:
  config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection: {leaderElect: false, resourceNamespace: multi-sched, resourceName: indep-a}
    profiles:
    - schedulerName: indep-a
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: indep-a, namespace: multi-sched}
spec:
  replicas: 1
  selector: {matchLabels: {app: indep-a}}
  template:
    metadata: {labels: {app: indep-a}}
    spec:
      serviceAccountName: scheduler
      containers:
      - name: kube-scheduler
        image: registry.k8s.io/kube-scheduler:v1.37.0
        command: ["kube-scheduler", "--config=/etc/s/config.yaml", "--bind-address=127.0.0.1", "--secure-port=0", "--v=2"]
        volumeMounts: [{name: c, mountPath: /etc/s}]
      volumes: [{name: c, configMap: {name: indep-a}}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: indep-b, namespace: multi-sched}
data:
  config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection: {leaderElect: false, resourceNamespace: multi-sched, resourceName: indep-b}
    profiles:
    - schedulerName: indep-b
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: indep-b, namespace: multi-sched}
spec:
  replicas: 1
  selector: {matchLabels: {app: indep-b}}
  template:
    metadata: {labels: {app: indep-b}}
    spec:
      serviceAccountName: scheduler
      containers:
      - name: kube-scheduler
        image: registry.k8s.io/kube-scheduler:v1.37.0
        command: ["kube-scheduler", "--config=/etc/s/config.yaml", "--bind-address=127.0.0.1", "--secure-port=0", "--v=2"]
        volumeMounts: [{name: c, mountPath: /etc/s}]
      volumes: [{name: c, configMap: {name: indep-b}}]
