# Three bystanders (one per QoS class) and a BestEffort "hog" that allocates 1.5Gi and holds it.
apiVersion: v1
kind: Pod
metadata: {name: besteffort}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: burstable}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"], resources: {requests: {memory: 64Mi}}}]
---
apiVersion: v1
kind: Pod
metadata: {name: guaranteed}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"], resources: {requests: {memory: 64Mi, cpu: 50m}, limits: {memory: 64Mi, cpu: 50m}}}]
---
apiVersion: v1
kind: Pod
metadata: {name: hog}
spec:
  containers:
  - name: hog
    image: python:3.12-alpine
    command: ["python", "-c", "import time; b = bytearray(1536*1024*1024); [b.__setitem__(i, 1) for i in range(0, len(b), 4096)]; print('allocated 1.5Gi', flush=True); time.sleep(3600)"]
