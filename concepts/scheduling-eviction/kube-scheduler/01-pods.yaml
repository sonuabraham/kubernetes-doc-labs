# Pods for the verbose scheduler: one any node can take, one that only fits after filtering, one nothing fits
apiVersion: v1
kind: Pod
metadata: {name: anywhere}
spec:
  schedulerName: verbose-scheduler
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"], resources: {requests: {cpu: 100m, memory: 64Mi}}}]
---
apiVersion: v1
kind: Pod
metadata: {name: picky}
spec:
  schedulerName: verbose-scheduler
  nodeSelector: {lab/disk: ssd}
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: impossible}
spec:
  schedulerName: verbose-scheduler
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"], resources: {requests: {cpu: "100"}}}]
