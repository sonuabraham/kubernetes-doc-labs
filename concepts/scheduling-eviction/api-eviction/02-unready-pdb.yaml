# "Troubleshooting stuck evictions": a Pod that never becomes Ready + a PDB → eviction is refused forever
# (IfHealthyBudget). unhealthyPodEvictionPolicy: AlwaysAllow lets unready Pods be evicted anyway.
apiVersion: v1
kind: Pod
metadata: {name: never-ready, namespace: default, labels: {app: never-ready}}
spec:
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "3600"]
    readinessProbe: {exec: {command: ["false"]}, periodSeconds: 2}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: never-ready-pdb, namespace: default}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: never-ready}}
