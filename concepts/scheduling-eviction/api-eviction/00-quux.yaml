# The Pod the docs' eviction.json targets (default/quux). A bare Pod (a Deployment would rename it), labelled app=quux for the PDB.
apiVersion: v1
kind: Pod
metadata:
  name: quux
  namespace: default
  labels: {app: quux}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"]}]
