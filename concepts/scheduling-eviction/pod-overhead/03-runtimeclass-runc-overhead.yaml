# Same overhead as the docs' kata-fc, but on the runc handler that minikube actually has,
# so the Pod really runs and the pod-level cgroup can be inspected.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: runc-overhead
handler: runc
overhead:
  podFixed:
    memory: "120Mi"
    cpu: "250m"
