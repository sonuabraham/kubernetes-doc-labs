# The docs' Workload + PodGroup + Pod, adjusted to the v1.37 API: the docs use
#   podGroupTemplateRef: {workload: {workloadName: ..., podGroupTemplateName: ...}}
# which v1.37 rejects ("unknown field spec.podGroupTemplateRef"). The served
# field (kubectl explain podgroup.spec.workloadRef) is:
#   workloadRef: {workloadName: ..., templateName: ...}
# The pod image "training:v1" is the docs' placeholder (it will not pull).
apiVersion: scheduling.k8s.io/v1beta1
kind: Workload
metadata:
  name: training-policy
spec:
  podGroupTemplates:
  - name: worker
    schedulingPolicy:
      gang:
        minCount: 4
---
apiVersion: scheduling.k8s.io/v1beta1
kind: PodGroup
metadata:
  name: training-worker-0
spec:
  workloadRef:
    workloadName: training-policy
    templateName: worker
  schedulingPolicy:
    gang:
      minCount: 4
---
apiVersion: v1
kind: Pod
metadata:
  name: worker-0
spec:
  schedulingGroup:
    podGroupName: training-worker-0
  containers:
  - name: ml-worker
    image: training:v1
