# Lab 5: a static Pod may NOT refer to other API objects (ConfigMap, Secret,
# ServiceAccount). The kubelet runs it from disk... let's see what it says.
apiVersion: v1
kind: Pod
metadata:
  name: static-cm
  namespace: default
spec:
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "3600"]
    envFrom:
    - configMapRef: {name: some-config}
