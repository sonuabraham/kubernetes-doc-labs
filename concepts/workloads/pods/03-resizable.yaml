# Lab 6: a Pod whose CPU/memory can be changed IN PLACE through the "resize"
# subresource (no restart for CPU; memory restarts only if resizePolicy says so).
apiVersion: v1
kind: Pod
metadata:
  name: resizable
  namespace: pods-demo
spec:
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "infinity"]
    resources:
      requests: {cpu: 100m, memory: 32Mi}
      limits:   {cpu: 200m, memory: 64Mi}
