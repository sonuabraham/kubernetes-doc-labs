# Lab 5: a namespace that ENFORCES the Restricted Pod Security Standard, and a
# root pod. With hostUsers: false the runAsNonRoot/runAsUser checks are relaxed.
apiVersion: v1
kind: Namespace
metadata:
  name: userns-restricted
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Pod
metadata: {name: root-in-userns, namespace: userns-restricted}
spec:
  hostUsers: false
  securityContext:
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: shell
    image: busybox:1.36
    command: ["sleep", "infinity"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: ["ALL"]}
