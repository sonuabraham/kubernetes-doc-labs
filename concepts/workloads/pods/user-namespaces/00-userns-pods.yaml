# Namespace userns-demo with two otherwise identical pods running as root:
#   with-userns    hostUsers: false -> root in the container, unprivileged UID on the host
#   without-userns (default hostUsers: true) -> root really is root on the host
apiVersion: v1
kind: Namespace
metadata:
  name: userns-demo
---
apiVersion: v1
kind: Pod
metadata: {name: with-userns, namespace: userns-demo}
spec:
  hostUsers: false
  containers:
  - name: shell
    image: busybox:1.36
    command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Pod
metadata: {name: without-userns, namespace: userns-demo}
spec:
  containers:
  - name: shell
    image: busybox:1.36
    command: ["sleep", "infinity"]
