# The docs' probe-example runs agnhost WITHOUT arguments -> agnhost's default
# subcommand ("pause") listens on nothing, so the startup probe can never pass.
# Same probes here, but agnhost runs "netexec", which serves HTTP on 8080
# and answers 200 for ANY path (/healthz, /ready, ...), so all three probes pass.
apiVersion: v1
kind: Pod
metadata:
  name: probe-example-runnable
  namespace: probes-demo
spec:
  containers:
  - name: app
    image: registry.k8s.io/e2e-test-images/agnhost:2.40
    args: ["netexec", "--http-port=8080"]
    ports:
    - containerPort: 8080
    startupProbe:
      httpGet:
        path: /healthz
        port: 8080
      failureThreshold: 30
      periodSeconds: 10
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080
      periodSeconds: 5
