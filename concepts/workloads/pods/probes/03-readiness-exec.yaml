# Lab 3: readiness. Ready only while /tmp/ready exists. NOT ready = removed from
# the Service's endpoints, but NOT restarted.
apiVersion: v1
kind: Pod
metadata:
  name: readiness-exec
  namespace: probes-demo
  labels: {app: ready-demo}
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "touch /tmp/ready; sleep infinity"]
    readinessProbe:
      exec: {command: ["cat", "/tmp/ready"]}
      periodSeconds: 2
      failureThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: ready-demo
  namespace: probes-demo
spec:
  selector: {app: ready-demo}
  ports: [{port: 80}]
