# Lab 4: setHostnameAsFQDN with an FQDN longer than 64 characters ->
# the Pod cannot start ("Failed to construct FQDN from Pod hostname and cluster domain").
apiVersion: v1
kind: Pod
metadata:
  name: this-pod-name-is-quite-long-on-purpose
  namespace: my-namespace
spec:
  subdomain: and-the-subdomain-is-long-too
  setHostnameAsFQDN: true
  containers:
  - {name: c, image: busybox:1.36, command: ["sleep", "3600"]}
