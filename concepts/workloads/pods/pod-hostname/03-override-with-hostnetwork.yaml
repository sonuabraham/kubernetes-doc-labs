# Lab 5: hostnameOverride cannot be combined with hostNetwork -> rejected by the API server.
apiVersion: v1
kind: Pod
metadata:
  name: override-hostnet
  namespace: my-namespace
spec:
  hostNetwork: true
  hostnameOverride: custom.example.domain
  containers:
  - {name: c, image: busybox:1.36, command: ["sleep", "3600"]}
