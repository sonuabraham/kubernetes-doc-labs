# Lab 4: spec.nodeName is env-only - in a downwardAPI volume it is rejected.
apiVersion: v1
kind: Pod
metadata: {name: bad-volume, namespace: downward-demo}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"], volumeMounts: [{name: v, mountPath: /etc/v}]}]
  volumes:
  - name: v
    downwardAPI:
      items: [{path: node, fieldRef: {fieldPath: spec.nodeName}}]
