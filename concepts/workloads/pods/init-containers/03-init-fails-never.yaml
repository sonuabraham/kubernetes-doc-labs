# Lab 4: init container fails + restartPolicy Never -> the whole Pod Fails.
# (With Always/OnFailure the init container is retried with back-off.)
apiVersion: v1
kind: Pod
metadata:
  name: init-fails-never
  namespace: init-demo
spec:
  restartPolicy: Never
  initContainers:
  - {name: check, image: busybox:1.36, command: ["sh", "-c", "echo precondition not met; exit 1"]}
  containers:
  - {name: app, image: busybox:1.36, command: ["sleep", "3600"]}
