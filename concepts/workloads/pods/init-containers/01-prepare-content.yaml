# Lab 2: init containers run IN ORDER, each to completion, before any app
# container. Typical use: prepare files the app needs, with tools the app image
# does not contain. Both init containers write into a shared emptyDir.
apiVersion: v1
kind: Pod
metadata:
  name: web-with-content
  namespace: init-demo
spec:
  initContainers:
  - name: step-1-fetch
    image: busybox:1.36
    command: ["sh", "-c", "echo '<h1>built at '$(date +%T)' by step-1</h1>' > /work/index.html; sleep 3"]
    volumeMounts: [{name: work, mountPath: /work}]
  - name: step-2-decorate
    image: busybox:1.36
    command: ["sh", "-c", "echo '<p>decorated at '$(date +%T)' by step-2</p>' >> /work/index.html"]
    volumeMounts: [{name: work, mountPath: /work}]
  containers:
  - name: web
    image: nginx:1.27
    volumeMounts: [{name: work, mountPath: /usr/share/nginx/html}]
  volumes:
  - name: work
    emptyDir: {}
