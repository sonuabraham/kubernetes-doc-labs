# Pods for the Pod Conditions lab (namespace conditions-demo).
apiVersion: v1
kind: Namespace
metadata:
  name: conditions-demo
---
# slow: each lifecycle condition flips to True at a visibly different time
#   init container sleeps 8s      -> Initialized later than PodReadyToStartContainers
#   readiness probe starts at 10s -> ContainersReady/Ready later still
apiVersion: v1
kind: Pod
metadata: {name: slow, namespace: conditions-demo}
spec:
  initContainers:
  - {name: init, image: busybox:1.36, command: ["sleep", "8"]}
  containers:
  - name: web
    image: nginx:1.27
    readinessProbe:
      httpGet: {path: /, port: 80}
      initialDelaySeconds: 10
---
# unschedulable: PodScheduled=False reason Unschedulable
apiVersion: v1
kind: Pod
metadata: {name: unschedulable, namespace: conditions-demo}
spec:
  nodeSelector: {disk: none}
  containers: [{name: c, image: "registry.k8s.io/pause:3.10"}]
---
# init-fails: Initialized=False (init container keeps failing)
apiVersion: v1
kind: Pod
metadata: {name: init-fails, namespace: conditions-demo}
spec:
  initContainers:
  - {name: init, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
  containers: [{name: c, image: "registry.k8s.io/pause:3.10"}]
---
# not-ready: ContainersReady/Ready=False (readiness probe never succeeds)
apiVersion: v1
kind: Pod
metadata: {name: not-ready, namespace: conditions-demo}
spec:
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "infinity"]
    readinessProbe:
      exec: {command: ["cat", "/tmp/ready"]}
      periodSeconds: 2
---
# gated: readiness gate never set -> Ready=False reason ReadinessGatesNotReady
apiVersion: v1
kind: Pod
metadata: {name: gated, namespace: conditions-demo}
spec:
  readinessGates: [{conditionType: "www.example.com/feature-1"}]
  containers: [{name: c, image: "registry.k8s.io/pause:3.10"}]
---
# evict-me: a finalizer keeps it visible after the Eviction API call, so you
# can read the DisruptionTarget condition (cleanup.sh removes the finalizer)
apiVersion: v1
kind: Pod
metadata: {name: evict-me, namespace: conditions-demo, finalizers: ["example.com/hold"]}
spec:
  containers: [{name: c, image: "registry.k8s.io/pause:3.10"}]
---
# resize-me: asks for an impossible in-place resize -> PodResizePending Infeasible
apiVersion: v1
kind: Pod
metadata: {name: resize-me, namespace: conditions-demo}
spec:
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "infinity"]
    resources:
      requests: {cpu: 100m}
      limits: {cpu: 100m}
