# Autoscaling overview lab (namespace autoscaling-demo): an app to scale.
apiVersion: v1
kind: Namespace
metadata: {name: autoscaling-demo}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: autoscaling-demo}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
      - name: web
        image: busybox:1.36
        command: ["sleep", "infinity"]
        resources:
          requests: {cpu: 100m, memory: 32Mi}
          limits:   {cpu: 200m, memory: 64Mi}
