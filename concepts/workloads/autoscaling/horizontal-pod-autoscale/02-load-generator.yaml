# Generates load: 4 busy loops hammering the php-apache Service.
apiVersion: apps/v1
kind: Deployment
metadata: {name: load-generator, namespace: hpa-demo}
spec:
  replicas: 4
  selector: {matchLabels: {app: load}}
  template:
    metadata: {labels: {app: load}}
    spec:
      containers:
      - name: load
        image: busybox:1.36
        command: ["sh", "-c", "while true; do wget -q -O- http://php-apache >/dev/null; done"]
