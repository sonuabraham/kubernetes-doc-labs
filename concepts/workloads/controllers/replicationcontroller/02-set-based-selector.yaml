# Lab 3: RCs only support EQUALITY selectors (a plain map). A ReplicaSet-style
# matchExpressions selector is not part of the RC API -> rejected.
apiVersion: v1
kind: ReplicationController
metadata: {name: setbased, namespace: rc-demo}
spec:
  replicas: 1
  selector:
    matchExpressions:
    - {key: app, operator: In, values: [web]}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"]}]
