# Lab 4/5: "Multiple release tracks" + "Using ReplicationControllers with Services".
# Two RCs (stable, canary) share app=web; each also has its own track label.
# One Service selects app=web -> traffic goes to BOTH tracks, by replica ratio.
# A manual "rolling update" = scale canary up, stable down, step by step.
apiVersion: v1
kind: ReplicationController
metadata: {name: web-stable, namespace: rc-demo}
spec:
  replicas: 3
  selector: {app: web, track: stable}
  template:
    metadata: {labels: {app: web, track: stable}}
    spec:
      containers:
      - {name: web, image: registry.k8s.io/e2e-test-images/agnhost:2.53, args: ["netexec", "--http-port=8080"]}
---
apiVersion: v1
kind: ReplicationController
metadata: {name: web-canary, namespace: rc-demo}
spec:
  replicas: 1
  selector: {app: web, track: canary}
  template:
    metadata: {labels: {app: web, track: canary}}
    spec:
      containers:
      - {name: web, image: registry.k8s.io/e2e-test-images/agnhost:2.53, args: ["netexec", "--http-port=8080"]}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: rc-demo}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 8080}]
