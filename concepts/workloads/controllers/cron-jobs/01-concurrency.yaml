# Lab 3: jobs that run 90s, scheduled every minute -> they would overlap.
#  slow-forbid : concurrencyPolicy Forbid  -> next run SKIPPED while one is running
#  slow-replace: concurrencyPolicy Replace -> running Job deleted, new one started
apiVersion: batch/v1
kind: CronJob
metadata: {name: slow-forbid, namespace: cron-demo}
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers: [{name: c, image: busybox:1.36, command: ["sleep", "90"]}]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: slow-replace, namespace: cron-demo}
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Replace
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers: [{name: c, image: busybox:1.36, command: ["sleep", "90"]}]
