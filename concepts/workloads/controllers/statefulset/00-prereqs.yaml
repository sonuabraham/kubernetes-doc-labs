# The docs' statefulset.yaml asks for storageClassName "my-storage-class".
# This StorageClass makes that name exist on minikube, using minikube's own
# hostpath provisioner, so the docs manifest runs UNCHANGED.
apiVersion: v1
kind: Namespace
metadata:
  name: sts-demo
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: my-storage-class
provisioner: k8s.io/minikube-hostpath
reclaimPolicy: Delete
volumeBindingMode: Immediate
