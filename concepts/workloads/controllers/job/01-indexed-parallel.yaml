# Lab 2: parallelism + completions + Indexed completion mode.
# 5 completions, 2 at a time; each pod knows its index (JOB_COMPLETION_INDEX,
# also in the hostname <job>-<index>-xxxxx and annotation batch.kubernetes.io/job-completion-index).
apiVersion: batch/v1
kind: Job
metadata:
  name: indexed
  namespace: job-demo
spec:
  completions: 5
  parallelism: 2
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "echo processing shard $JOB_COMPLETION_INDEX on $(hostname); sleep 3"]
