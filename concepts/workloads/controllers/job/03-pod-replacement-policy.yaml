# Lab 7: podReplacementPolicy Failed - a replacement pod is created only once the
# old pod is fully Failed (not while it is still terminating). status.terminating
# counts the terminating pods.
apiVersion: batch/v1
kind: Job
metadata:
  name: new
  namespace: job-demo
spec:
  podReplacementPolicy: Failed
  completions: 1
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 20
      containers:
      - name: c
        image: busybox:1.36
        command: ["sh", "-c", "trap 'sleep 15; exit 1' TERM; sleep infinity"]
