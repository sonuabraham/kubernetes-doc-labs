# Lab 3: gang vs basic through Jobs (WorkloadWithJob, alpha). The 2 lab nodes
# (wl-lab, single node) has 8 allocatable CPUs.
#   gang-too-big : 8 pods x 2500m = 20 CPU > 8 -> gang: NOTHING is bound
#   basic-too-big: same pods, basic policy -> 2 pods bound (5 CPU), 6 Pending (partial placement)
#   gang-fits    : 8 pods x 1 CPU -> all 8 bound together
apiVersion: v1
kind: Namespace
metadata: {name: gang-demo}
---
apiVersion: batch/v1
kind: Job
metadata: {name: gang-too-big, namespace: gang-demo}
spec:
  parallelism: 8
  completions: 8
  completionMode: Indexed
  scheduling:
    schedulingPolicy: {gang: {}}
  template:
    spec:
      restartPolicy: Never
      containers: [{name: c, image: busybox:1.36, command: ["sleep", "120"], resources: {requests: {cpu: 2500m}}}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: basic-too-big, namespace: gang-demo}
spec:
  parallelism: 8
  completions: 8
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      containers: [{name: c, image: busybox:1.36, command: ["sleep", "120"], resources: {requests: {cpu: 2500m}}}]
