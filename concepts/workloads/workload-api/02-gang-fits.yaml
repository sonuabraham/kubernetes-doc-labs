# Lab 4: a gang that fits: 8 pods x 500m = 4 CPU -> all 8 are bound in the same scheduling cycle.
apiVersion: batch/v1
kind: Job
metadata: {name: gang-fits, namespace: gang-demo}
spec:
  parallelism: 8
  completions: 8
  completionMode: Indexed
  scheduling:
    schedulingPolicy: {gang: {}}
  template:
    spec:
      restartPolicy: Never
      containers: [{name: c, image: busybox:1.36, command: ["sleep", "30"], resources: {requests: {cpu: 500m}}}]
