# Lab 5: gang + topology constraint (TopologyAwareWorkloadScheduling, alpha).
# Nodes are labelled zone-a / zone-b (README). All pods of the gang must fit in
# ONE zone.
#   zone-gang-big  : 4 x 3 CPU = 12 -> fits the CLUSTER (16) but no single zone (8) -> Unschedulable
#   zone-gang-small: 2 x 3 CPU = 6  -> both pods land in the SAME zone
apiVersion: batch/v1
kind: Job
metadata: {name: zone-gang-big, namespace: gang-demo}
spec:
  parallelism: 4
  completions: 4
  completionMode: Indexed
  scheduling:
    schedulingPolicy: {gang: {}}
    schedulingConstraints:
      topology: [{key: topology.kubernetes.io/zone}]
  template:
    spec:
      restartPolicy: Never
      containers: [{name: c, image: busybox:1.36, command: ["sleep", "60"], resources: {requests: {cpu: "3"}}}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: zone-gang-small, namespace: gang-demo}
spec:
  parallelism: 2
  completions: 2
  completionMode: Indexed
  scheduling:
    schedulingPolicy: {gang: {}}
    schedulingConstraints:
      topology: [{key: topology.kubernetes.io/zone}]
  template:
    spec:
      restartPolicy: Never
      containers: [{name: c, image: busybox:1.36, command: ["sleep", "60"], resources: {requests: {cpu: "3"}}}]
