# Pod-level budget 4 CPU / 1Gi (requests = limits). "worker" is a Guaranteed container (2 CPU, integer) → exclusive slice.
# "sidecar" has no resources → it uses the Pod's shared pool (pod scope) or the node's shared pool (container scope).
apiVersion: v1
kind: Pod
metadata: {name: hybrid}
spec:
  resources:
    requests: {cpu: "4", memory: 1Gi}
    limits: {cpu: "4", memory: 1Gi}
  containers:
  - name: worker
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests: {cpu: "2", memory: 256Mi}
      limits: {cpu: "2", memory: 256Mi}
  - name: sidecar
    image: busybox:1.36
    command: ["sleep", "3600"]
