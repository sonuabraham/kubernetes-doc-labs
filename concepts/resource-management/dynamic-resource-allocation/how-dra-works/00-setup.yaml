apiVersion: v1
kind: Namespace
metadata: {name: dra-how}
---
# For the docs' binding-conditions slice (driver dra.example.com): a class and a claim
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata: {name: dra.example.com}
spec:
  selectors:
  - cel: {expression: 'device.driver == "dra.example.com"'}
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata: {name: slow-gpu, namespace: dra-how}
spec:
  devices:
    requests:
    - name: gpu
      exactly: {deviceClassName: dra.example.com}
---
# A standalone claim on the fake gpu.example.com driver for the lifecycle lab
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata: {name: lifecycle, namespace: dra-how}
spec:
  devices:
    requests:
    - name: gpu
      exactly: {deviceClassName: gpu.example.com}
