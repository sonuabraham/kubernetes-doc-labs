# Lab 1: Container-level restarts by restartPolicy. Each container exits with
# code 1 after 3 seconds. The kubelet restarts it according to the policy.
apiVersion: v1
kind: Namespace
metadata:
  name: healing-demo
---
apiVersion: v1
kind: Pod
metadata: {name: always, namespace: healing-demo}
spec:
  restartPolicy: Always
  containers: [{name: c, image: busybox:1.36, command: ["sh", "-c", "sleep 3; exit 1"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: onfailure, namespace: healing-demo}
spec:
  restartPolicy: OnFailure
  containers: [{name: c, image: busybox:1.36, command: ["sh", "-c", "sleep 3; exit 1"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: never, namespace: healing-demo}
spec:
  restartPolicy: Never
  containers: [{name: c, image: busybox:1.36, command: ["sh", "-c", "sleep 3; exit 1"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: onfailure-success, namespace: healing-demo}
spec:
  restartPolicy: OnFailure
  containers: [{name: c, image: busybox:1.36, command: ["sh", "-c", "sleep 3; exit 0"]}]
