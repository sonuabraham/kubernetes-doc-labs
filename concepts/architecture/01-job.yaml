# Lab 3: the docs' "Job controller" example - watches Job objects and creates
# Pods to run the task to completion.
apiVersion: batch/v1
kind: Job
metadata:
  name: one-off
  namespace: arch-demo
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: c
        image: busybox:1.36
        command: ["sh", "-c", "echo task done on $(hostname)"]
