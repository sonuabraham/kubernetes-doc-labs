# Demo for control plane <-> node communication (cluster "arch-lab").
# Namespace comm-demo:
#   Deployment web + Service web   -> target for logs/exec/port-forward and
#                                     for the API server's proxy
#   ServiceAccount pod-reader + RBAC
#   Pod api-client (on the WORKER) -> talks to the API server the way pods
#                                     should: SA token + cluster CA, via the
#                                     "kubernetes" Service
apiVersion: v1
kind: Namespace
metadata:
  name: comm-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: comm-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      nodeName: arch-lab-m02
      containers:
      - name: web
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args: ["netexec", "--http-port=8080"]
        ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: comm-demo
spec:
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader
  namespace: comm-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: comm-demo
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader
  namespace: comm-demo
subjects: [{kind: ServiceAccount, name: pod-reader, namespace: comm-demo}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: pod-reader}
---
apiVersion: v1
kind: Pod
metadata:
  name: api-client
  namespace: comm-demo
spec:
  nodeName: arch-lab-m02
  serviceAccountName: pod-reader
  containers:
  - name: curl
    image: curlimages/curl:8.11.1
    command: ["sleep", "infinity"]
