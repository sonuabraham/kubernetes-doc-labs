# Lab 1: The docs' thermostat as a Kubernetes API.
#   spec.desiredTemperature  = desired state (you set it)
#   status.currentTemperature = current state (the controller reports it)
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: thermostats.home.example.com
spec:
  group: home.example.com
  scope: Namespaced
  names: {plural: thermostats, singular: thermostat, kind: Thermostat, shortNames: [thermo]}
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - {name: Desired, type: integer, jsonPath: .spec.desiredTemperature}
    - {name: Current, type: integer, jsonPath: .status.currentTemperature}
    - {name: Heater,  type: string,  jsonPath: .status.heater}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              desiredTemperature: {type: integer, minimum: 5, maximum: 30}
          status:
            type: object
            properties:
              currentTemperature: {type: integer}
              heater: {type: string}
