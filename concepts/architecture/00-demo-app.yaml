# Demo for the Cluster Architecture lab (cluster: minikube profile "arch-lab",
# 2 nodes). Namespace arch-demo:
#   Deployment web (4 replicas)  -> where do pods land? (control plane vs worker)
#   Service web                  -> kube-proxy on EVERY node, DNS addon
# agnhost netexec answers /hostname with the pod name.
apiVersion: v1
kind: Namespace
metadata:
  name: arch-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: arch-demo
spec:
  replicas: 4
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: web
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args: ["netexec", "--http-port=8080"]
        ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: arch-demo
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 8080}]
