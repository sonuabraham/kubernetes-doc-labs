# Lab 3: A Service that "requires cloud infrastructure" - type LoadBalancer.
# Without a service controller, EXTERNAL-IP stays <pending>.
apiVersion: v1
kind: Namespace
metadata:
  name: ccm-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ccm-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: web
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args: ["netexec", "--http-port=8080"]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ccm-demo
spec:
  type: LoadBalancer
  selector: {app: web}
  ports: [{port: 80, targetPort: 8080}]
