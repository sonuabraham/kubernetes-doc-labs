# NOT from the docs: things the page doesn't show.
#  CPU_REQ_M    requests.cpu with divisor 1m  -> 125 instead of the rounded-up 1
#  MEM_REQ_MI   requests.memory, divisor 1Mi  -> 32
#  CPU_LIMIT    limits.cpu for a container WITHOUT a CPU limit -> node allocatable CPU
#  APP_LABEL    one label via metadata.labels['app'] (whole labels/annotations maps only work as files)
#  HOST_IP / POD_IPS  status.hostIP / status.podIPs
apiVersion: v1
kind: Pod
metadata:
  name: dapi-extras
  labels: {app: dapi-demo}
spec:
  restartPolicy: Never
  containers:
  - name: c
    image: busybox:1.36
    command: ["sh", "-c", "env | grep -E '^(CPU|MEM|APP|HOST|POD)_' | sort"]
    resources:
      requests: {cpu: 125m, memory: 32Mi}
    env:
    - {name: CPU_REQ_M, valueFrom: {resourceFieldRef: {resource: requests.cpu, divisor: 1m}}}
    - {name: MEM_REQ_MI, valueFrom: {resourceFieldRef: {resource: requests.memory, divisor: 1Mi}}}
    - {name: CPU_LIMIT, valueFrom: {resourceFieldRef: {resource: limits.cpu}}}
    - {name: APP_LABEL, valueFrom: {fieldRef: {fieldPath: "metadata.labels['app']"}}}
    - {name: HOST_IP, valueFrom: {fieldRef: {fieldPath: status.hostIP}}}
    - {name: POD_IPS, valueFrom: {fieldRef: {fieldPath: status.podIPs}}}
