# NOT from the docs: live updates vs. subPath, per-file mode, single label/annotation keys,
# and a resource with no limit set. Two mounts of the same downwardAPI volume:
#   /etc/podinfo           whole volume  -> updated when labels/annotations change
#   /etc/labels-subpath    subPath mount -> frozen at container start
apiVersion: v1
kind: Pod
metadata:
  name: dapi-volume-extras
  labels:
    app: dapi-demo
    version: v1
  annotations:
    owner: team-a
spec:
  containers:
  - name: main
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests: {cpu: 100m, memory: 16Mi}
      limits: {memory: 32Mi}          # no CPU limit on purpose
    volumeMounts:
    - {name: podinfo, mountPath: /etc/podinfo}
    - {name: podinfo, mountPath: /etc/labels-subpath, subPath: labels}
  volumes:
  - name: podinfo
    downwardAPI:
      defaultMode: 0444
      items:
      - {path: labels, fieldRef: {fieldPath: metadata.labels}}
      - {path: annotations, fieldRef: {fieldPath: metadata.annotations}}
      - {path: version, fieldRef: {fieldPath: "metadata.labels['version']"}}
      - {path: owner, fieldRef: {fieldPath: "metadata.annotations['owner']"}}
      - {path: meta/name, fieldRef: {fieldPath: metadata.name}}
      - {path: meta/uid, fieldRef: {fieldPath: metadata.uid}, mode: 0400}
      - {path: cpu_limit, resourceFieldRef: {containerName: main, resource: limits.cpu}}
      - {path: mem_limit_mi, resourceFieldRef: {containerName: main, resource: limits.memory, divisor: 1Mi}}
