# An Ingress in the REMOVED extensions/v1beta1 API (gone since v1.22) - input for kubectl convert.
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: legacy
spec:
  rules:
  - host: legacy.example.com
    http:
      paths:
      - path: /
        backend:
          serviceName: web
          servicePort: 80
