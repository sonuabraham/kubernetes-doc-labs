# The docs' job.yaml with the two edits the page asks for, for minikube: image = the locally built job-wq-1
# (minikube image build), and imagePullPolicy: Never because an untagged image means :latest = always pull.
apiVersion: batch/v1
kind: Job
metadata:
  name: job-wq-1
spec:
  completions: 8
  parallelism: 2
  template:
    metadata:
      name: job-wq-1
    spec:
      containers:
      - name: c
        image: job-wq-1
        imagePullPolicy: Never
        env:
        - name: BROKER_URL
          value: amqp://guest:guest@rabbitmq-service:5672
        - name: QUEUE
          value: job1
      restartPolicy: OnFailure
