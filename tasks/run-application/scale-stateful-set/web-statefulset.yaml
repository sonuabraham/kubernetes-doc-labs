# NOT from the docs (the page has no manifest): a small StatefulSet to scale.
# The readiness probe fails while /tmp/unready exists, so a Pod can be made unhealthy with
#   kubectl exec web-N -- touch /tmp/unready      (and healthy again with rm)
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: web
  ports:
  - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  serviceName: web
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: nginx
        image: nginx:1.27
        readinessProbe:
          exec:
            command: ["sh", "-c", "! test -f /tmp/unready"]
          periodSeconds: 1
          failureThreshold: 1
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 100Mi
