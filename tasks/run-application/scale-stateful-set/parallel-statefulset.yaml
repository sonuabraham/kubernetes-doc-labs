# NOT from the docs: web-statefulset.yaml with podManagementPolicy: Parallel (name webp, reuses the headless Service name
# only for DNS naming; no Service of its own). Used to compare scale-down with an unready Pod.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: webp
  labels:
    app.kubernetes.io/name: webp
spec:
  serviceName: web
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: webp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webp
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: nginx
        image: nginx:1.27
        readinessProbe:
          exec:
            command: ["sh", "-c", "! test -f /tmp/unready"]
          periodSeconds: 1
          failureThreshold: 1
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 100Mi
