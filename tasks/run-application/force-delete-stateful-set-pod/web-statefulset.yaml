# NOT from the docs (the page has no manifest): a 2-replica StatefulSet whose Pods log their identity every second.
# Pod anti-affinity spreads web-0 and web-1 over the two nodes of the force-lab cluster. No PVCs (minikube's
# hostpath provisioner can't move volumes between nodes); the point is the Pod *identity*.
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  clusterIP: None
  selector:
    app: web
  ports:
  - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
spec:
  serviceName: web
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: web
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "while true; do echo \"$(date +%T) I am $(hostname) on $NODE\"; sleep 1; done"]
        env:
        - name: NODE
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
