# NOT from the docs (the page uses placeholders): a StatefulSet + headless Service labelled
# app.kubernetes.io/name=MyApp, matching the label in the page's commands. terminationGracePeriodSeconds: 10.
apiVersion: v1
kind: Service
metadata:
  name: myapp
  labels:
    app.kubernetes.io/name: MyApp
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: MyApp
  ports:
  - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: myapp
  labels:
    app.kubernetes.io/name: MyApp
spec:
  serviceName: myapp
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: MyApp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: MyApp
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: nginx
        image: nginx:1.27
        readinessProbe:
          exec:
            command: ["sh", "-c", "! test -f /tmp/unready"]
          periodSeconds: 1
          failureThreshold: 1
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 100Mi
