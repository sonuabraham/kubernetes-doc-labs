# NOT from the docs: a stand-in for ZooKeeper. A 3-replica StatefulSet with label app: zookeeper, so the docs' zk-pdb selects it.
# The readiness probe fails while /tmp/unready exists (kubectl exec zk-N -- touch /tmp/unready).
apiVersion: v1
kind: Service
metadata:
  name: zk
spec:
  clusterIP: None
  selector:
    app: zookeeper
  ports:
  - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zk
spec:
  serviceName: zk
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: nginx
        image: nginx:1.27
        readinessProbe:
          exec:
            command: ["sh", "-c", "! test -f /tmp/unready"]
          periodSeconds: 1
          failureThreshold: 1
