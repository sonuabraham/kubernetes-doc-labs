# NOT from the docs: a namespace as it might look before migration - what level can it take?
#   web     : Deployment, plain nginx                 -> baseline OK, restricted NOT
#   logger  : Deployment with a hostPath volume       -> violates baseline
#   nightly : CronJob with hostNetwork, NOT running   -> violates baseline, invisible to a dry-run of existing Pods
apiVersion: v1
kind: Namespace
metadata: {name: legacy}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: legacy}
spec:
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers: [{name: nginx, image: nginx}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: logger, namespace: legacy}
spec:
  selector: {matchLabels: {app: logger}}
  template:
    metadata: {labels: {app: logger}}
    spec:
      containers:
      - {name: c, image: busybox:1.36, command: ["sleep", "3600"], volumeMounts: [{name: logs, mountPath: /host-logs}]}
      volumes: [{name: logs, hostPath: {path: /var/log}}]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: nightly, namespace: legacy}
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          hostNetwork: true
          restartPolicy: OnFailure
          containers: [{name: c, image: busybox:1.36, command: ["true"]}]
