# NOT from the docs: PSP could DEFAULT fields (defaultAllowPrivilegeEscalation, seccomp default profile,
# requiredDropCapabilities, runAsUser MustRunAs ...). Pod Security Admission never mutates, so the docs say to use a
# mutating webhook. A MutatingAdmissionPolicy does it without a webhook server. Pod-level fields are only filled when UNSET; containers without a securityContext get one,
# in namespaces labelled psa-defaults=restricted, so the Pod then passes the "restricted" level.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata: {name: restricted-defaults}
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
    - {apiGroups: [""], apiVersions: ["v1"], operations: ["CREATE"], resources: ["pods"]}
    namespaceSelector:
      matchLabels: {psa-defaults: restricted}
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: >-
        Object{spec: Object.spec{securityContext: Object.spec.securityContext{
          runAsNonRoot: has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) ? object.spec.securityContext.runAsNonRoot : true,
          runAsUser:    has(object.spec.securityContext) && has(object.spec.securityContext.runAsUser) ? object.spec.securityContext.runAsUser : 65534,
          seccompProfile: Object.spec.securityContext.seccompProfile{type: "RuntimeDefault"}}}}
  # containers: capabilities.drop is an atomic list, which ApplyConfiguration may not set, so use JSONPatch and add a
  # complete securityContext to every container that has none (containers that set their own are left alone)
  - patchType: JSONPatch
    jsonPatch:
      expression: >-
        lists.range(size(object.spec.containers)).filter(i, !has(object.spec.containers[i].securityContext)).map(i,
          JSONPatch{op: "add", path: "/spec/containers/" + string(i) + "/securityContext",
            value: Object.spec.containers.securityContext{
              allowPrivilegeEscalation: false,
              capabilities: Object.spec.containers.securityContext.capabilities{drop: ["ALL"]}}})
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata: {name: restricted-defaults}
spec:
  policyName: restricted-defaults
---
apiVersion: v1
kind: Namespace
metadata:
  name: defaulted
  labels:
    psa-defaults: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
