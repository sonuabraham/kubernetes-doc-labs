# NOT from the docs: a slow-starting app around the docs' startup-probe snippet (named port liveness-port,
# liveness failureThreshold 1 / period 10, startup failureThreshold 30 / period 10 = up to 300 s to start).
# busybox httpd only starts serving /healthz after 45 s. Without the startup probe, a liveness probe with
# failureThreshold 1 would kill it long before that (see startup-probe-missing below).
apiVersion: v1
kind: Pod
metadata:
  name: slow-start
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /www; echo ok > /www/healthz; sleep 45; exec httpd -f -p 8080 -h /www"]
    ports:
    - name: liveness-port
      containerPort: 8080
    livenessProbe:
      httpGet:
        path: /healthz
        port: liveness-port
      failureThreshold: 1
      periodSeconds: 10
    startupProbe:
      httpGet:
        path: /healthz
        port: liveness-port
      failureThreshold: 30
      periodSeconds: 10
---
apiVersion: v1
kind: Pod
metadata:
  name: startup-probe-missing
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /www; echo ok > /www/healthz; sleep 45; exec httpd -f -p 8080 -h /www"]
    ports:
    - name: liveness-port
      containerPort: 8080
    livenessProbe:
      httpGet:
        path: /healthz
        port: liveness-port
      failureThreshold: 1
      periodSeconds: 10
