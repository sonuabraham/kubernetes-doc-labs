# NOT from the docs: the docs' exec readinessProbe (cat /tmp/healthy) on 2 replicas behind a Service, to
# watch endpoints come and go. The container is NOT restarted when readiness fails.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ready-demo
spec:
  replicas: 2
  selector: {matchLabels: {app: ready-demo}}
  template:
    metadata: {labels: {app: ready-demo}}
    spec:
      containers:
      - name: web
        image: busybox:1.36
        command: ["sh", "-c", "mkdir -p /www; hostname > /www/index.html; touch /tmp/healthy; exec httpd -f -p 8080 -h /www"]
        readinessProbe:
          exec:
            command:
            - /bin/cat
            - /tmp/healthy
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ready-demo
spec:
  selector: {app: ready-demo}
  ports: [{port: 80, targetPort: 8080}]
