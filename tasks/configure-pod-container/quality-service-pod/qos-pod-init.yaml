# NOT from the docs: the app container alone would be Guaranteed, but the init container has no
# resources -> the rules apply to init containers too -> Burstable.
apiVersion: v1
kind: Pod
metadata:
  name: qos-demo-6
  namespace: qos-example
spec:
  initContainers:
  - name: init
    image: busybox:1.36
    command: ["true"]
  containers:
  - name: qos-demo-6-ctr
    image: nginx
    resources:
      limits: {memory: "200Mi", cpu: "700m"}
      requests: {memory: "200Mi", cpu: "700m"}
