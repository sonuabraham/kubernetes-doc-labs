# NOT from the docs.
#  init-order : two init containers run one after another (each appends a line with a timestamp),
#               then the app prints the file - shows strict ordering.
#  init-fail  : an init container that exits 1 -> the app container never starts (Init:Error / Init:CrashLoopBackOff).
apiVersion: v1
kind: Pod
metadata: {name: init-order}
spec:
  initContainers:
  - {name: first,  image: busybox:1.36, command: ["sh", "-c", "echo \"first  $(date +%T)\" >> /work/log; sleep 3"], volumeMounts: [{name: w, mountPath: /work}]}
  - {name: second, image: busybox:1.36, command: ["sh", "-c", "echo \"second $(date +%T)\" >> /work/log; sleep 3"], volumeMounts: [{name: w, mountPath: /work}]}
  containers:
  - {name: app, image: busybox:1.36, command: ["sh", "-c", "echo \"app    $(date +%T)\" >> /work/log; cat /work/log; sleep 3600"], volumeMounts: [{name: w, mountPath: /work}]}
  volumes: [{name: w, emptyDir: {}}]
---
apiVersion: v1
kind: Pod
metadata: {name: init-fail}
spec:
  initContainers:
  - {name: check-db, image: busybox:1.36, command: ["sh", "-c", "echo 'waiting for db... giving up'; exit 1"]}
  containers:
  - {name: app, image: busybox:1.36, command: ["sleep", "3600"]}
