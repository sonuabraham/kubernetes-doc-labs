# NOT from the docs: a Pod kept around by a finalizer after deletion, to see the docs' rule
# "credentials are revoked 60 seconds beyond .metadata.deletionTimestamp, even if finalizers are in place".
apiVersion: v1
kind: Pod
metadata:
  name: sa-finalizer
  finalizers: ["lab.example.com/hold"]
spec:
  terminationGracePeriodSeconds: 5
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "1h"]}]
