# The docs' two opt-out snippets made complete (the docs elide the rest with "..."):
# the ServiceAccount opts out; my-pod repeats the opt-out; my-pod-override opts back IN (Pod spec wins).
# NOTE: this redefines build-robot with automountServiceAccountToken: false.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-robot
automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
  name: my-pod
spec:
  serviceAccountName: build-robot
  automountServiceAccountToken: false
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "1h"]}]
---
apiVersion: v1
kind: Pod
metadata:
  name: my-pod-override        # not in the docs
spec:
  serviceAccountName: build-robot
  automountServiceAccountToken: true
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "1h"]}]
---
apiVersion: v1
kind: Pod
metadata:
  name: my-pod-inherit         # not in the docs
spec:
  serviceAccountName: build-robot
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "1h"]}]
