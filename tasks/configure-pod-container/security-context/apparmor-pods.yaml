# NOT from the docs (the docs only show snippets): one Pod per appArmorProfile type.
# k8s-apparmor-example-deny-write is the docs' Localhost profile name; it is NOT loaded on this node, so that
# Pod shows the failure you get when the profile is missing (loading profiles: tutorials/security/apparmor).
apiVersion: v1
kind: Pod
metadata: {name: apparmor-default}
spec:
  containers: [{name: container-1, image: busybox:1.36, command: ["sleep", "1h"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: apparmor-runtimedefault}
spec:
  containers:
  - name: container-1
    image: busybox:1.36
    command: ["sleep", "1h"]
    securityContext:
      appArmorProfile:
        type: RuntimeDefault
---
apiVersion: v1
kind: Pod
metadata: {name: apparmor-unconfined}
spec:
  containers:
  - name: container-1
    image: busybox:1.36
    command: ["sleep", "1h"]
    securityContext:
      appArmorProfile:
        type: Unconfined
---
apiVersion: v1
kind: Pod
metadata: {name: apparmor-localhost}
spec:
  containers:
  - name: container-1
    image: busybox:1.36
    command: ["sleep", "1h"]
    securityContext:
      appArmorProfile:
        type: Localhost
        localhostProfile: k8s-apparmor-example-deny-write
