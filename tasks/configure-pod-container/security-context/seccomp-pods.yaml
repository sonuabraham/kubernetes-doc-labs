# NOT from the docs (the docs only show snippets): one Pod per seccompProfile type.
# The Localhost profiles must exist on the node under <kubelet-root-dir>/seccomp/ = /var/lib/kubelet/seccomp/
# (copied there in the README with `minikube cp`).
apiVersion: v1
kind: Pod
metadata: {name: seccomp-none}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "1h"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: seccomp-runtimedefault}
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "1h"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: seccomp-unconfined}
spec:
  securityContext:
    seccompProfile:
      type: Unconfined
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "1h"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: seccomp-localhost-allow}
spec:
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "1h"]
    securityContext:
      seccompProfile:
        type: Localhost
        localhostProfile: my-profiles/profile-allow.json
---
apiVersion: v1
kind: Pod
metadata: {name: seccomp-localhost-deny-mkdir}
spec:
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "1h"]
    securityContext:
      seccompProfile:
        type: Localhost
        localhostProfile: my-profiles/profile-deny-mkdir.json
---
apiVersion: v1
kind: Pod
metadata: {name: seccomp-localhost-missing}
spec:
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "1h"]
    securityContext:
      seccompProfile:
        type: Localhost
        localhostProfile: my-profiles/does-not-exist.json
