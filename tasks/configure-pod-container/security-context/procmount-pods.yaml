# NOT from the docs (the docs only show the snippet): procMount Default vs Unmasked.
# Unmasked requires a user namespace (hostUsers: false) - the first Pod shows the validation error,
# the second one runs.
apiVersion: v1
kind: Pod
metadata: {name: procmount-unmasked-hostusers}
spec:
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "1h"]
    securityContext:
      procMount: Unmasked
---
apiVersion: v1
kind: Pod
metadata: {name: procmount-unmasked}
spec:
  hostUsers: false
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "1h"]
    securityContext:
      procMount: Unmasked
---
apiVersion: v1
kind: Pod
metadata: {name: procmount-default}
spec:
  hostUsers: false
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "1h"]
