# NOT from the docs: fsGroupChangePolicy on a real PersistentVolume (csi-hostpath-sc; its CSIDriver has
# fsGroupPolicy: File, so the kubelet does the chown/chmod). Apply one role at a time with -l role=...
#   writer : fsGroup 2000 - creates files; volume root becomes group 2000 + setgid
#   tamper : root, no fsGroup - sets ONE nested file back to group 0 (root dir untouched)
#   onroot : fsGroup 2000, OnRootMismatch - root dir already matches -> nothing is walked -> file stays group 0
#   always : fsGroup 2000, Always          - recursive walk on every mount -> file fixed to group 2000
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fsgroup-pvc
  labels: {role: pvc}
spec:
  storageClassName: csi-hostpath-sc
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Mi}}
---
apiVersion: v1
kind: Pod
metadata: {name: fsgroup-writer, labels: {role: writer}}
spec:
  restartPolicy: Never
  securityContext: {runAsUser: 1000, runAsGroup: 3000, fsGroup: 2000}
  volumes: [{name: data, persistentVolumeClaim: {claimName: fsgroup-pvc}}]
  containers:
  - name: c
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /data/sub && echo a > /data/a && echo b > /data/sub/b && ls -lnR /data"]
    volumeMounts: [{name: data, mountPath: /data}]
---
apiVersion: v1
kind: Pod
metadata: {name: fsgroup-tamper, labels: {role: tamper}}
spec:
  restartPolicy: Never
  volumes: [{name: data, persistentVolumeClaim: {claimName: fsgroup-pvc}}]
  containers:
  - name: c
    image: busybox:1.36
    command: ["sh", "-c", "chgrp 0 /data/sub/b && ls -lnR /data"]
    volumeMounts: [{name: data, mountPath: /data}]
---
apiVersion: v1
kind: Pod
metadata: {name: fsgroup-onroot, labels: {role: onroot}}
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000
    fsGroupChangePolicy: "OnRootMismatch"
  volumes: [{name: data, persistentVolumeClaim: {claimName: fsgroup-pvc}}]
  containers:
  - name: c
    image: busybox:1.36
    command: ["ls", "-lnR", "/data"]
    volumeMounts: [{name: data, mountPath: /data}]
---
apiVersion: v1
kind: Pod
metadata: {name: fsgroup-always, labels: {role: always}}
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000
    fsGroupChangePolicy: "Always"
  volumes: [{name: data, persistentVolumeClaim: {claimName: fsgroup-pvc}}]
  containers:
  - name: c
    image: busybox:1.36
    command: ["ls", "-lnR", "/data"]
    volumeMounts: [{name: data, mountPath: /data}]
