# NOT from the docs: security-context-4.yaml with a busybox container running as root, so the added
# capabilities show up in CapPrm/CapEff (gcr.io/google-samples/hello-app:2.0 now runs as uid 65532,
# and a non-root process gets an empty effective set - see the README).
apiVersion: v1
kind: Pod
metadata:
  name: security-context-demo-4-root
spec:
  containers:
  - name: sec-ctx-4
    image: busybox:1.36
    command: ["sleep", "1h"]
    securityContext:
      capabilities:
        add: ["NET_ADMIN", "SYS_TIME"]
