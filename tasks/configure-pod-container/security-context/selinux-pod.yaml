# NOT from the docs: the docs' seLinuxOptions snippet in a Pod. minikube's node has no SELinux, so the
# field is accepted and has no effect (see README).
apiVersion: v1
kind: Pod
metadata: {name: selinux-demo}
spec:
  securityContext:
    seLinuxOptions:
      level: "s0:c123,c456"
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "1h"]}]
