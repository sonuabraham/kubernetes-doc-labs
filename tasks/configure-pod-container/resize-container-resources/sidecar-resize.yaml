# NOT from the docs: a Burstable Pod with a regular init container and a sidecar
# (restartable init container) - only the sidecar and the main container can be resized.
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-demo
  namespace: qos-example
spec:
  initContainers:
  - name: setup
    image: busybox:1.36
    command: ["true"]
    resources:
      requests: {cpu: 100m, memory: 32Mi}
  - name: sidecar
    image: registry.k8s.io/pause:3.8
    restartPolicy: Always
    resources:
      requests: {cpu: 100m, memory: 32Mi}
  containers:
  - name: app
    image: registry.k8s.io/pause:3.8
    resources:
      requests: {cpu: 100m, memory: 32Mi}
      limits: {cpu: 200m, memory: 64Mi}
