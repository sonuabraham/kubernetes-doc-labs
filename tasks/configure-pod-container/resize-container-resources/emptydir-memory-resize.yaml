# NOT from the docs (the docs only give the patch command): a Pod with a memory-backed emptyDir
# named "cache-volume", as in the docs' patch, to resize its sizeLimit in place.
# Needs gate InPlacePodVerticalScalingMemoryBackedVolumes (alpha) -> profile resize-lab.
apiVersion: v1
kind: Pod
metadata:
  name: cache-demo
  namespace: qos-example
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "infinity"]
    resources:
      requests: {cpu: 100m, memory: 300Mi}
      limits: {cpu: 200m, memory: 300Mi}
    volumeMounts:
    - name: cache-volume
      mountPath: /cache
  volumes:
  - name: cache-volume
    emptyDir:
      medium: Memory
      sizeLimit: 100Mi
