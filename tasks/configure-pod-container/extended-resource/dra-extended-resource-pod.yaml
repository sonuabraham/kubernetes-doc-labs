# NOT from the docs: requests 2 x example.com/gpu exactly like a device-plugin resource.
# No Node advertises example.com/gpu - DRA (DeviceClass gpu.example.com) satisfies it.
apiVersion: v1
kind: Pod
metadata:
  name: dra-extended-resource-demo
spec:
  containers:
  - name: ctr
    image: busybox:1.36
    command: ["sh", "-c", "env | grep GPU_DEVICE | sort; sleep infinity"]
    resources:
      requests:
        example.com/gpu: 2
      limits:
        example.com/gpu: 2
