# NOT from the docs: three Pods, one per Pod Security level they satisfy.
#   pod-privileged : hostNetwork              -> violates baseline (and restricted)
#   pod-baseline   : plain nginx              -> passes baseline, violates restricted
#   pod-restricted : non-root, drop ALL, ...  -> passes everything
apiVersion: v1
kind: Pod
metadata: {name: pod-privileged}
spec:
  hostNetwork: true
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: pod-baseline}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: pod-restricted}
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "3600"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: ["ALL"]}
