apiVersion: apps/v1
kind: DaemonSet
metadata:
  annotations:
    kompose.cmd: ../bin/kompose convert -f ../docker-compose.yml --controller daemonSet -o ds/
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: redis-leader
  name: redis-leader
spec:
  selector:
    matchLabels:
      io.kompose.service: redis-leader
  template:
    metadata:
      labels:
        io.kompose.service: redis-leader
    spec:
      containers:
        - image: redis
          name: redis-leader
          ports:
            - containerPort: 6379
              protocol: TCP
      restartPolicy: Always
