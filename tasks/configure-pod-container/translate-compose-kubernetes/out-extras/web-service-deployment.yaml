apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: ../bin/kompose convert -f ../docker-compose-extras.yml
    kompose.service.expose: web.example.com
    kompose.service.type: nodeport
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: web-service
  name: web-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: web-service
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: ../bin/kompose convert -f ../docker-compose-extras.yml
        kompose.service.expose: web.example.com
        kompose.service.type: nodeport
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: web-service
    spec:
      containers:
        - image: nginx
          name: web-service
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: web-data
      restartPolicy: Always
      volumes:
        - name: web-data
          persistentVolumeClaim:
            claimName: web-data
