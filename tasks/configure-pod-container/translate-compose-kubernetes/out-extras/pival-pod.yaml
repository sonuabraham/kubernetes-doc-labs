apiVersion: v1
kind: Pod
metadata:
  annotations:
    kompose.cmd: ../bin/kompose convert -f ../docker-compose-extras.yml
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: pival
  name: pival
spec:
  containers:
    - args:
        - perl
        - -Mbignum=bpi
        - -wle
        - print bpi(2000)
      image: perl
      name: pival
  restartPolicy: OnFailure
