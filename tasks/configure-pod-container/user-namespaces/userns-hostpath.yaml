# NOT from the docs: "root" in a user namespace vs root-only files on the node.
# Both Pods mount a root-only node directory /var/lab-root-only (drwx------ root; created in the README; the node root fs is overlayfs and cannot do idmapped mounts) read-only and try to list it.
apiVersion: v1
kind: Pod
metadata: {name: hostpath-hostusers}
spec:
  restartPolicy: Never
  containers:
  - {name: c, image: busybox:1.36, command: ["sh", "-c", "id; ls /node-root && cat /node-root/secret"], volumeMounts: [{name: r, mountPath: /node-root, readOnly: true}]}
  volumes: [{name: r, hostPath: {path: /var/lab-root-only, type: Directory}}]
---
apiVersion: v1
kind: Pod
metadata: {name: hostpath-userns}
spec:
  hostUsers: false
  restartPolicy: Never
  containers:
  - {name: c, image: busybox:1.36, command: ["sh", "-c", "id; ls /node-root && cat /node-root/secret"], volumeMounts: [{name: r, mountPath: /node-root, readOnly: true}]}
  volumes: [{name: r, hostPath: {path: /var/lab-root-only, type: Directory}}]
