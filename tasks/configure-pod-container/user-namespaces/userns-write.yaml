# NOT from the docs: write through an idmapped hostPath from a user-namespaced Pod, then check the owner on the node.
apiVersion: v1
kind: Pod
metadata: {name: hostpath-userns-write}
spec:
  hostUsers: false
  restartPolicy: Never
  containers:
  - {name: c, image: busybox:1.36, command: ["sh", "-c", "echo hi > /node-dir/from-userns-pod; ls -ln /node-dir"], volumeMounts: [{name: r, mountPath: /node-dir}]}
  volumes: [{name: r, hostPath: {path: /var/lab-root-only, type: Directory}}]
