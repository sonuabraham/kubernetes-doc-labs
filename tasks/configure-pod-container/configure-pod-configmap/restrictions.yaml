# NOT from the docs: the page's "Restrictions", made visible.
#  missing-cm  : non-optional reference to a ConfigMap that doesn't exist -> CreateContainerConfigError
#  bad-keys    : envFrom of a ConfigMap whose keys are not valid env var names
apiVersion: v1
kind: ConfigMap
metadata: {name: myconfig}
data: {1badkey: "x", 2alsobad: "y", good_key: "z"}
---
apiVersion: v1
kind: Pod
metadata: {name: missing-cm}
spec:
  restartPolicy: Never
  containers:
  - name: c
    image: busybox:1.36
    command: ["sh", "-c", "echo $SPECIAL"]
    env:
    - name: SPECIAL
      valueFrom: {configMapKeyRef: {name: does-not-exist, key: k}}
---
apiVersion: v1
kind: Pod
metadata: {name: bad-keys}
spec:
  restartPolicy: Never
  containers:
  - name: c
    image: busybox:1.36
    command: ["sh", "-c", "env | grep -iE 'key|bad' || true"]
    envFrom: [{configMapRef: {name: myconfig}}]
