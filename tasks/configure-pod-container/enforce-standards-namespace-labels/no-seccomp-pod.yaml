# NOT from the docs: a Pod that meets restricted EXCEPT for seccomp - to see what enforce-version pinning changes.
apiVersion: v1
kind: Pod
metadata: {name: no-seccomp}
spec:
  securityContext: {runAsNonRoot: true, runAsUser: 1000}
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "3600"]
    securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
