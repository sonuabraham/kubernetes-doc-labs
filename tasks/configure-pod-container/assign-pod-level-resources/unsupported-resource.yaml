# Not from the docs: tests the page's limitation "only CPU, memory and hugepages resources can be specified at pod-level".
apiVersion: v1
kind: Pod
metadata:
  name: pod-level-ephemeral
  namespace: pod-resources-example
spec:
  resources:
    limits:
      ephemeral-storage: 1Gi
  containers:
  - name: c
    image: busybox:1.36
    command: ["sleep", "3600"]
