# Not from the docs: pod-level requests must be >= the sum of the containers' requests (and container limits <= pod limits).
apiVersion: v1
kind: Pod
metadata:
  name: pod-level-too-small
  namespace: pod-resources-example
spec:
  resources:
    requests:
      cpu: "500m"
  containers:
  - name: c1
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests:
        cpu: "400m"
  - name: c2
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests:
        cpu: "400m"
