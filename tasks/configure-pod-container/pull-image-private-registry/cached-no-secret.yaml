# NOT from the docs: the private image is already on the node (pulled by private-reg). Can a Pod WITHOUT
# credentials use it? With imagePullPolicy IfNotPresent, the kubelet's KubeletEnsureSecretPulledImages
# (beta, on in 1.37) re-checks credentials for images that were pulled with a Secret.
apiVersion: v1
kind: Pod
metadata:
  name: cached-no-secret
spec:
  containers:
  - name: c
    image: localhost:5000/janedoe/jdoe-private:v1
    imagePullPolicy: IfNotPresent
