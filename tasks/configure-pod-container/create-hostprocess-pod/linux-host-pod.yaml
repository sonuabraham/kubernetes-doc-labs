# NOT from the docs: the nearest LINUX equivalent of a HostProcess Pod, to see on minikube what
# "a container that is really a host process" means. Linux has no hostProcess flag; you combine
# hostNetwork + hostPID + privileged + a hostPath of / instead. Same Pod Security level: privileged only.
apiVersion: v1
kind: Pod
metadata:
  name: linux-host-demo
spec:
  hostNetwork: true
  hostPID: true
  containers:
  - name: shell
    image: busybox:1.36
    command: ["sleep", "infinity"]
    securityContext:
      privileged: true
    volumeMounts:
    - name: host-root
      mountPath: /host
  volumes:
  - name: host-root
    hostPath:
      path: /
