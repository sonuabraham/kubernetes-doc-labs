# NOT from the docs (the page has no manifests): a Deployment + NodePort Service managed with create/replace/delete -f.
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: imp-cfg}
spec:
  replicas: 1
  selector:
    matchLabels: {controller-selector: "apps.v1.deployment.web"}     # the docs' style, with "." (a "/" is invalid in label values)
  template:
    metadata:
      labels: {controller-selector: "apps.v1.deployment.web", app: web}
    spec:
      containers: [{name: web, image: "nginx:1.27"}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: imp-cfg}
spec:
  type: NodePort
  selector: {app: web}
  ports: [{port: 80}]
