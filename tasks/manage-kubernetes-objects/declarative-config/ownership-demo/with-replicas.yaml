# NOT from the docs: a Deployment whose file owns replicas: 3 ...
apiVersion: apps/v1
kind: Deployment
metadata: {name: owner-demo}
spec:
  replicas: 3
  selector: {matchLabels: {app: owner-demo}}
  template:
    metadata: {labels: {app: owner-demo}}
    spec:
      containers: [{name: c, image: "busybox:1.36", args: ["sleep", "3600"]}]
