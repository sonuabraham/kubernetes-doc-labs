# NOT from the docs: the docs' list-merge example as a real Deployment ("last-applied-configuration value").
apiVersion: apps/v1
kind: Deployment
metadata: {name: merge-demo}
spec:
  selector: {matchLabels: {app: merge-demo}}
  template:
    metadata: {labels: {app: merge-demo}}
    spec:
      containers:
      - {name: nginx, image: "nginx:1.16.1"}
      - {name: nginx-helper-a, image: "busybox:1.36", args: ["sleep", "3600"]}
      - {name: nginx-helper-b, image: "busybox:1.36", args: ["sleep", "3600"]}
