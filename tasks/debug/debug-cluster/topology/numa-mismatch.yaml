# NOT from the docs: a Guaranteed Pod that also asks for one toy device. The plugin reports its devices on NUMA
# node 1 (toy-plugin-numa1.yaml), but CPUs and memory only exist on node 0 - single-numa-node can't align them.
apiVersion: v1
kind: Pod
metadata: {name: numa-mismatch}
spec:
  restartPolicy: Never
  containers:
  - name: guaranteed
    image: busybox:1.36
    resources:
      limits: {cpu: "1", memory: 512Mi, hardware-vendor.example/foo: 1}
      requests: {cpu: "1", memory: 512Mi, hardware-vendor.example/foo: 1}
    command: ["sleep", "infinity"]
