# NOT from the docs: the docs' "guaranteed" Pod sized for this node (1 NUMA node, ~30 GiB) and with a real image
# (the docs use image "consumer" + imagePullPolicy Never, which doesn't exist here, and 150Gi, which no node has).
apiVersion: v1
kind: Pod
metadata: {name: guaranteed-fits}
spec:
  containers:
  - name: guaranteed
    image: busybox:1.36
    resources:
      limits: {cpu: "2", memory: 1Gi}
      requests: {cpu: "2", memory: 1Gi}
    command: ["sleep", "infinity"]
