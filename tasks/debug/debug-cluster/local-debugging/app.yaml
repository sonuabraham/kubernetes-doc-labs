# NOT from the docs: the "remote" application. Service hello -> Deployment hello (v1, in the cluster),
# a ConfigMap the app depends on, and a "frontend" Pod that calls hello every 2 s (= other services using it).
apiVersion: v1
kind: Namespace
metadata: {name: tp-demo}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: hello-config, namespace: tp-demo}
data: {GREETING: "hello", DB_HOST: "db.tp-demo.svc.cluster.local"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hello, namespace: tp-demo}
spec:
  replicas: 2
  selector: {matchLabels: {app: hello}}
  template:
    metadata: {labels: {app: hello}}
    spec:
      containers:
      - name: hello
        image: busybox:1.36
        command: ["sh", "-c", "mkdir /w; echo \"hello from cluster-v1 on $(hostname)\" > /w/index.html; httpd -f -p 8080 -h /w"]
---
apiVersion: v1
kind: Service
metadata: {name: hello, namespace: tp-demo}
spec:
  selector: {app: hello}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Pod
metadata: {name: frontend, namespace: tp-demo}
spec:
  containers:
  - name: frontend
    image: busybox:1.36
    command: ["sh", "-c", "while true; do echo \"$(date +%T) $(wget -qO- -T 2 http://hello/ 2>&1)\"; sleep 2; done"]
