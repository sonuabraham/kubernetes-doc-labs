# NOT from the docs: a Pod pinned (nodeSelector) to the fake node fake-1, tolerating "unreachable" for only 30 s
# instead of the default 300 s - so the eviction the docs mention happens quickly once fake-1 goes silent.
apiVersion: v1
kind: Pod
metadata: {name: on-fake-node}
spec:
  nodeSelector: {kubernetes.io/hostname: fake-1}
  tolerations:
  - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"]}]
