# NOT from the docs (the page uses <pod-name>/<init-container-1>/<init-container-2> placeholders):
#   init-container-1 : succeeds after 5 s
#   init-container-2 : a shell script with `set -x` (the docs' tip) that waits for a Service "mydb" which
#                      doesn't exist, gives up after a few tries and exits 1  -> Init:Error / Init:CrashLoopBackOff
apiVersion: v1
kind: Pod
metadata: {name: init-debug-demo}
spec:
  initContainers:
  - name: init-container-1
    image: busybox:1.36
    command: ["sh", "-c", "echo fetching config; sleep 5"]
  - name: init-container-2
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      set -x
      for i in 1 2 3; do
        nslookup mydb.default.svc.cluster.local && exit 0
        sleep 2
      done
      echo "mydb never showed up" >&2
      exit 1
  containers:
  - {name: app, image: busybox:1.36, command: ["sleep", "3600"]}
