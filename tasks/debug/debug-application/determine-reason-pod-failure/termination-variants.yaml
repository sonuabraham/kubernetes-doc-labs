# NOT from the docs.
#  multi-container-pod : the docs' go-template example name; two containers, each leaves its own message
#  msg-path-demo       : the docs' terminationMessagePath "/tmp/my-log" snippet, made runnable
#  fallback-demo       : terminationMessagePolicy FallbackToLogsOnError - nothing in the file, exits 1 -> last log lines
#  file-policy-demo    : same container with the default policy File -> no message at all
#  big-message         : writes 10000 bytes -> truncated by the kubelet
#  four-big-messages   : 4 containers x 5000 bytes -> the per-Pod 12 KiB budget split 4 ways
apiVersion: v1
kind: Pod
metadata: {name: multi-container-pod}
spec:
  restartPolicy: Never
  containers:
  - {name: db-migrate, image: debian, command: ["/bin/sh", "-c", "echo 'migration 0042 failed: column exists' > /dev/termination-log; exit 3"]}
  - {name: app,        image: debian, command: ["/bin/sh", "-c", "echo 'shut down cleanly' > /dev/termination-log"]}
---
apiVersion: v1
kind: Pod
metadata: {name: msg-path-demo}
spec:
  restartPolicy: Never
  containers:
  - name: msg-path-demo-container
    image: debian
    terminationMessagePath: "/tmp/my-log"
    command: ["/bin/sh", "-c", "echo 'written to /tmp/my-log' > /tmp/my-log; exit 1"]
---
apiVersion: v1
kind: Pod
metadata: {name: fallback-demo}
spec:
  restartPolicy: Never
  containers:
  - name: c
    image: debian
    terminationMessagePolicy: FallbackToLogsOnError
    command: ["/bin/sh", "-c", "echo starting; echo 'panic: nil pointer dereference in handler.go:42'; exit 2"]
---
apiVersion: v1
kind: Pod
metadata: {name: file-policy-demo}
spec:
  restartPolicy: Never
  containers:
  - name: c
    image: debian
    command: ["/bin/sh", "-c", "echo starting; echo 'panic: nil pointer dereference in handler.go:42'; exit 2"]
---
apiVersion: v1
kind: Pod
metadata: {name: big-message}
spec:
  restartPolicy: Never
  containers:
  - {name: c, image: debian, command: ["/bin/sh", "-c", "head -c 10000 /dev/zero | tr '\\0' x > /dev/termination-log; exit 1"]}
---
# 4 containers x 5000 bytes: the 12 KiB per-Pod budget is split equally -> 3072 bytes each
apiVersion: v1
kind: Pod
metadata: {name: four-big-messages}
spec:
  restartPolicy: Never
  containers:
  - {name: c1, image: debian, command: ["/bin/sh", "-c", "head -c 5000 /dev/zero | tr '\\0' x > /dev/termination-log; exit 1"]}
  - {name: c2, image: debian, command: ["/bin/sh", "-c", "head -c 5000 /dev/zero | tr '\\0' x > /dev/termination-log; exit 1"]}
  - {name: c3, image: debian, command: ["/bin/sh", "-c", "head -c 5000 /dev/zero | tr '\\0' x > /dev/termination-log; exit 1"]}
  - {name: c4, image: debian, command: ["/bin/sh", "-c", "head -c 5000 /dev/zero | tr '\\0' x > /dev/termination-log; exit 1"]}
