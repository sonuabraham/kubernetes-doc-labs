# NOT from the docs (the page has no manifest): a StatefulSet whose Pods carry the docs' label
# app.kubernetes.io/name=MyApp. Pod ordinal 1 never becomes Ready (its readiness file only exists on ordinal 0, 2...),
# so with the default podManagementPolicy OrderedReady, ordinal 2 is never even created.
apiVersion: v1
kind: Service
metadata: {name: myapp, namespace: debug-sts-demo}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: MyApp}
  ports: [{port: 80}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: myapp, namespace: debug-sts-demo}
spec:
  serviceName: myapp
  replicas: 3
  selector: {matchLabels: {app.kubernetes.io/name: MyApp}}
  template:
    metadata: {labels: {app.kubernetes.io/name: MyApp}}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "[ \"${HOSTNAME##*-}\" != 1 ] && touch /tmp/ready; sleep 3600"]
        readinessProbe:
          exec: {command: ["cat", "/tmp/ready"]}
          periodSeconds: 2
