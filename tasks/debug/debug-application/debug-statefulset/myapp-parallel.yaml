# NOT from the docs: myapp-statefulset.yaml with podManagementPolicy: Parallel - all ordinals start at once, so a
# broken ordinal 1 no longer blocks ordinal 2. (Extra label variant=par keeps the two StatefulSets apart.)
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: myapp-par, namespace: debug-sts-demo}
spec:
  serviceName: myapp
  podManagementPolicy: Parallel
  replicas: 3
  selector: {matchLabels: {app.kubernetes.io/name: MyApp, variant: par}}
  template:
    metadata: {labels: {app.kubernetes.io/name: MyApp, variant: par}}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "[ \"${HOSTNAME##*-}\" != 1 ] && touch /tmp/ready; sleep 3600"]
        readinessProbe:
          exec: {command: ["cat", "/tmp/ready"]}
          periodSeconds: 2
