# NOT from the docs: the docs' "my-pod" with containers main-app and helper-app, plus the
# kubectl.kubernetes.io/default-container annotation that decides where `kubectl exec` goes without -c.
apiVersion: v1
kind: Pod
metadata:
  name: my-pod
  annotations:
    kubectl.kubernetes.io/default-container: helper-app
spec:
  containers:
  - {name: main-app, image: nginx}
  - {name: helper-app, image: busybox:1.36, command: ["sleep", "3600"]}
