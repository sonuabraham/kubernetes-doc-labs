# "My pod is running but not doing what I told it to do": `commnd` instead of `command` (the docs' example).
apiVersion: v1
kind: Pod
metadata: {name: mypod, namespace: debug-pods-demo}
spec:
  containers:
  - name: c
    image: busybox:1.36
    commnd: ["sh", "-c", "echo hello from my command; sleep 3600"]
