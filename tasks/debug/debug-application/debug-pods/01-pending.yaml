# "My pod stays pending": (a) asks for more CPU than any node has, (b) hostPort - only one replica fits per node.
apiVersion: v1
kind: Pod
metadata: {name: too-big, namespace: debug-pods-demo}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"], resources: {requests: {cpu: "100"}}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hostport, namespace: debug-pods-demo}
spec:
  replicas: 2
  selector: {matchLabels: {app: hostport}}
  template:
    metadata: {labels: {app: hostport}}
    spec:
      containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"], ports: [{containerPort: 8080, hostPort: 18080}]}]
