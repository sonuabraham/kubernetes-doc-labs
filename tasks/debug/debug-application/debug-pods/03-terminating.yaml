# "My pod stays terminating": a finalizer nobody removes, plus a validating policy (in place of the docs' admission
# webhook) that rejects pod UPDATEs which remove finalizers - so even the cleanup is blocked.
apiVersion: v1
kind: Pod
metadata:
  name: stuck
  namespace: debug-pods-demo
  finalizers: ["example.com/cleanup"]
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"]}]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: keep-pod-finalizers}
spec:
  matchConstraints:
    resourceRules: [{apiGroups: [""], apiVersions: ["v1"], operations: ["UPDATE"], resources: ["pods"]}]
    namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: debug-pods-demo}}
  validations:
  - expression: "!has(oldObject.metadata.finalizers) || (has(object.metadata.finalizers) && oldObject.metadata.finalizers.all(f, f in object.metadata.finalizers))"
    message: "finalizers may not be removed"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: keep-pod-finalizers}
spec: {policyName: keep-pod-finalizers, validationActions: [Deny]}
