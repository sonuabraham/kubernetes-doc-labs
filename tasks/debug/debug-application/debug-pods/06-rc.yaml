# "Debugging Replication Controllers": an RC whose Pods are refused (namespace Pod quota of 1 is already used).
apiVersion: v1
kind: ResourceQuota
metadata: {name: one-pod, namespace: debug-pods-rc}
spec: {hard: {pods: "1"}}
---
apiVersion: v1
kind: ReplicationController
metadata: {name: web-rc, namespace: debug-pods-rc}
spec:
  replicas: 3
  selector: {app: web-rc}
  template:
    metadata: {labels: {app: web-rc}}
    spec:
      containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"]}]
