# NOT from the docs: actually USE huge pages. Python maps files on the hugetlbfs emptyDir (writes to hugetlbfs only work
# through mmap) - first 40 MiB, then 80 MiB more, which exceeds the 100Mi limit.
apiVersion: v1
kind: Pod
metadata:
  name: hugepages-user
spec:
  restartPolicy: Never
  containers:
  - name: py
    image: python:3.13-slim
    command:
    - python3
    - -c
    - |
      import mmap, os, time
      def use(name, mib):
          fd = os.open(f"/hugepages/{name}", os.O_CREAT | os.O_RDWR)
          os.ftruncate(fd, mib << 20)
          m = mmap.mmap(fd, mib << 20)
          for off in range(0, mib << 20, 2 << 20): m[off] = 1     # touch every 2 MiB page
          print(f"{name}: {mib} MiB mapped and touched", flush=True)
          return m
      a = use("a", 40); time.sleep(5)
      b = use("b", 80)                                            # 40 + 80 > 100 Mi
      time.sleep(3600)
    volumeMounts:
    - {mountPath: /hugepages, name: hugepage}
    resources:
      limits: {hugepages-2Mi: 100Mi, memory: 200Mi}
      requests: {memory: 200Mi}
  volumes:
  - name: hugepage
    emptyDir: {medium: HugePages}
