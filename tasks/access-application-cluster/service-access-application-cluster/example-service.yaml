# NOT from the docs (the page only mentions the option): the same Service as
# `kubectl expose deployment hello-world --type=NodePort --name=example-service`, as a file.
# nodePort 30080 is fixed here (expose picks a random one from 30000-32767).
apiVersion: v1
kind: Service
metadata:
  name: example-service
spec:
  type: NodePort
  selector:
    run: load-balancer-example
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 30080
