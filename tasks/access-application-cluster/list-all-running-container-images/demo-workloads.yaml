# NOT from the docs: something to list. An nginx Deployment labelled app=nginx (the page's label filter) and a Pod
# with an init container + sidecar, to see which containers each command includes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: with-init
spec:
  initContainers:
  - name: setup
    image: busybox:1.36
    command: ["true"]
  - name: log-shipper
    image: busybox:1.37
    restartPolicy: Always
    command: ["sleep", "3600"]
  containers:
  - name: app
    image: nginx:1.27
