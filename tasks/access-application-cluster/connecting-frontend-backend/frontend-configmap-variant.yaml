# NOT from the docs: what the page's note suggests. Stock nginx + the same frontend-nginx.conf from a ConfigMap
# (create it with: kubectl create configmap frontend-nginx-conf --from-file=frontend-nginx.conf), instead of
# baking the config into gcr.io/google-samples/hello-frontend:1.0. Exposed as NodePort 30081.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-cm
spec:
  selector:
    matchLabels:
      app: hello
      tier: frontend-cm
  replicas: 1
  template:
    metadata:
      labels:
        app: hello
        tier: frontend-cm
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        volumeMounts:
        - name: conf
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: conf
        configMap:
          name: frontend-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-cm
spec:
  type: NodePort
  selector:
    app: hello
    tier: frontend-cm
  ports:
  - port: 80
    nodePort: 30081
