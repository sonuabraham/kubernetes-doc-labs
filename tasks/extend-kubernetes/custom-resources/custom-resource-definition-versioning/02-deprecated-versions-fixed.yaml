# NOT from the docs: 02-deprecated-versions.yaml with real schemas instead of "schema: ..." (a literal string "...",
# which the API server rejects). Same versions, flags and warning text.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: crontabs.example.com
spec:
  group: example.com
  names:
    plural: crontabs
    singular: crontab
    kind: CronTab
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: false
    deprecated: true
    deprecationWarning: "example.com/v1alpha1 CronTab is deprecated; see http://example.com/v1alpha1-v1 for instructions to migrate to example.com/v1 CronTab"
    schema: &s
      openAPIV3Schema:
        type: object
        properties:
          host: {type: string}
          port: {type: string}
  - name: v1beta1
    served: true
    deprecated: true
    schema: *s
  - name: v1
    served: true
    storage: true
    schema: *s
