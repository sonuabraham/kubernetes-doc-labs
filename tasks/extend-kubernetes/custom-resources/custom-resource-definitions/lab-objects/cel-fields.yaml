# NOT from the docs: one CRD carrying the docs' rule snippets B33 (messageExpression), B34 (reason), B35 (fieldPath)
# on three sibling objects, B36 (transition rule) on spec.level, and the optionalOldSelf table's first rule on spec.pinned.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: limits.lab.example.com
spec:
  group: lab.example.com
  scope: Namespaced
  names: {plural: limits, singular: limit, kind: Limit}
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              withMessageExpression:          # B33
                type: object
                properties: {x: {type: integer}, maxLimit: {type: integer}}
                x-kubernetes-validations:
                - rule: "self.x <= self.maxLimit"
                  # docs: '"x exceeded max limit of " + string(self.maxLimit)' -> rejected by the cost estimator in v1.37
                  messageExpression: '"x exceeded max limit of %d".format([self.maxLimit])'
              withReason:                     # B34
                type: object
                properties: {x: {type: integer}, maxLimit: {type: integer}}
                x-kubernetes-validations:
                - rule: "self.x <= self.maxLimit"
                  reason: "FieldValueForbidden"
              withFieldPath:                  # B35
                type: object
                properties:
                  maxLimit: {type: integer}
                  foo: {type: object, properties: {test: {type: object, properties: {x: {type: integer}}}}}
                x-kubernetes-validations:
                - rule: "self.foo.test.x <= self.maxLimit"
                  fieldPath: ".foo.test.x"
              level:                          # B36
                type: string
                enum: ["low", "medium", "high"]
                x-kubernetes-validations:
                - rule: "!(self == 'high' && oldSelf == 'low') && !(self == 'low' && oldSelf == 'high')"
                  message: cannot transition directly between 'low' and 'high'
              pinned:                         # optionalOldSelf table, row 1
                type: object
                properties: {foo: {type: string}}
                x-kubernetes-validations:
                - rule: 'self.foo == "foo" || (oldSelf.hasValue() && oldSelf.value().foo != "foo")'
                  optionalOldSelf: true
                  message: 'new objects must use foo; once "foo", it stays "foo"'
