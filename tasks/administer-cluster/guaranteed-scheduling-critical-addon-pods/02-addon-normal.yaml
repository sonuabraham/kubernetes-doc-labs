# Not from the docs: an "add-on" in kube-system WITHOUT a priority class (priority 0, like the filler).
apiVersion: v1
kind: Pod
metadata:
  name: addon-normal
  namespace: kube-system
spec:
  containers:
  - name: addon
    image: registry.k8s.io/pause:3.10
    resources:
      requests: {cpu: "1"}
