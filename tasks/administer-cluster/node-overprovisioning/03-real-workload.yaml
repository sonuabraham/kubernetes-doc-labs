# Lab 3 (not from the docs): an ordinary workload (default priority 0) that needs more CPU than is free.
# The scheduler preempts placeholder Pods (priority -1000) to make room - the whole point of overprovisioning.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: real-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: real-app
  template:
    metadata:
      labels:
        app: real-app
    spec:
      containers:
      - name: app
        image: registry.k8s.io/pause:3.6
        resources:
          requests:
            cpu: "1500m"
            memory: "64Mi"
