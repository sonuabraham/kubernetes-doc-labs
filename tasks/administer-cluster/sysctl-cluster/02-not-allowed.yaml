# Not from the docs: kernel.sem is namespaced but UNSAFE and not in this node's allow-list (kernel.msg*,
# net.core.somaxconn), so the kubelet rejects the Pod. (net.ipv4.tcp_fin_timeout would NOT do: it's safe since 1.29.)
apiVersion: v1
kind: Pod
metadata:
  name: sysctl-not-allowed
spec:
  securityContext:
    sysctls:
    - name: kernel.sem
      value: "250 32000 32 128"
  containers:
  - {name: c, image: busybox:1.36, command: ["sleep", "3600"]}
