# Not from the docs: the page's exception - net.* sysctls (even safe ones) are not allowed with hostNetwork.
apiVersion: v1
kind: Pod
metadata:
  name: sysctl-hostnetwork
spec:
  hostNetwork: true
  securityContext:
    sysctls:
    - name: net.ipv4.ip_local_port_range
      value: "20000 30000"
  containers:
  - {name: c, image: busybox:1.36, command: ["sleep", "3600"]}
