# Not from the docs: vm.swappiness is a node-level (non-namespaced) sysctl - it can't be set per Pod at all.
apiVersion: v1
kind: Pod
metadata:
  name: sysctl-node-level
spec:
  securityContext:
    sysctls:
    - name: vm.swappiness
      value: "10"
  containers:
  - {name: c, image: busybox:1.36, command: ["sleep", "3600"]}
