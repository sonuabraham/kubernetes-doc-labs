# Not from the docs (the consumer side is the next task page, "Assign Extended Resources to a Container"):
# two Pods asking for 3 and 2 of the node's 4 advertised example.com/dongle. Only one fits.
# Extended resources: integers only, and requests must equal limits (no overcommit).
apiVersion: v1
kind: Namespace
metadata:
  name: dongle-demo
---
apiVersion: v1
kind: Pod
metadata:
  name: dongle-3
  namespace: dongle-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      limits:
        example.com/dongle: 3
---
apiVersion: v1
kind: Pod
metadata:
  name: dongle-2
  namespace: dongle-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      limits:
        example.com/dongle: 2
