# Not from the docs: a stand-in for the docs' "Consul domain server" - a small CoreDNS that is authoritative
# for consul.local (web.consul.local -> 10.150.0.42, db.consul.local -> 10.150.0.43), reachable at a fixed
# ClusterIP 10.100.150.1 (the docs' 10.150.0.1 is outside minikube's Service range 10.96.0.0/12).
apiVersion: v1
kind: ConfigMap
metadata:
  name: consul-dns
  namespace: kube-system
data:
  Corefile: |
    consul.local:53 {
        log
        hosts {
            10.150.0.42 web.consul.local
            10.150.0.43 db.consul.local
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consul-dns
  namespace: kube-system
spec:
  selector:
    matchLabels: {app: consul-dns}
  template:
    metadata:
      labels: {app: consul-dns}
    spec:
      containers:
      - name: coredns
        image: registry.k8s.io/coredns/coredns:v1.14.6
        args: ["-conf", "/etc/coredns/Corefile"]
        volumeMounts: [{name: conf, mountPath: /etc/coredns}]
      volumes:
      - name: conf
        configMap: {name: consul-dns}
---
apiVersion: v1
kind: Service
metadata:
  name: consul-dns
  namespace: kube-system
spec:
  clusterIP: 10.100.150.1
  selector: {app: consul-dns}
  ports:
  - {name: dns, port: 53, protocol: UDP}
  - {name: dns-tcp, port: 53, protocol: TCP}
