# The docs' second excerpt ("a pod sharing CPU(s) runs in the Guaranteed QoS class"), spec verbatim, wrapped.
apiVersion: v1
kind: Pod
metadata:
  name: guaranteed-shared-cpu
  namespace: mem-demo
spec:
  containers:
  - name: nginx
    image: nginx
    resources:
      limits:
        memory: "200Mi"
        cpu: "300m"
        example.com/device: "1"
      requests:
        memory: "200Mi"
        cpu: "300m"
        example.com/device: "1"
