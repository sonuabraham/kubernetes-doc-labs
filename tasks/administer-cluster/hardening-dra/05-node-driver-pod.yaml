# Not from the docs: plays a node-local DRA driver. Runs on node "minikube" as ServiceAccount node-driver; its
# projected token carries the node it runs on, which is what the "associated-node:*" verbs check against the
# node the claim is allocated to. It patches the claim's device status once and prints the API response.
apiVersion: v1
kind: Pod
metadata:
  name: node-driver
  namespace: dra-demo
spec:
  serviceAccountName: node-driver
  restartPolicy: Never
  nodeName: minikube
  containers:
  - name: driver
    image: curlimages/curl:8.11.1
    command: ["sh", "-c"]
    args:
    - |
      T=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
      echo "token node claim: $(echo $T | cut -d. -f2 | base64 -d 2>/dev/null | grep -o '"node":{[^}]*}')"
      curl -s --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt -H "Authorization: Bearer $T" \
        -H "Content-Type: application/merge-patch+json" -X PATCH \
        https://kubernetes.default.svc/apis/resource.k8s.io/v1/namespaces/dra-demo/resourceclaims/gpu-claim/status \
        -d '{"status":{"devices":[{"driver":"dra.example.com","pool":"pool-a","device":"gpu-0","conditions":[{"type":"Ready","status":"True","reason":"FromNode","message":"set by node-local driver","lastTransitionTime":"2026-11-14T00:00:00Z"}]}]}}' \
        | tr -d '\n' | sed -E 's/.*"message": *"([^}]*)",.*/response message: \1/' | cut -c1-400; echo
