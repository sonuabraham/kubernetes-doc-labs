# The docs' "Pod interactions with topology manager policies" example #5 (BestEffort with two devices), spec verbatim, wrapped.
apiVersion: v1
kind: Pod
metadata:
  name: besteffort-devices
  namespace: topo-demo
spec:
  containers:
  - name: nginx
    image: nginx
    resources:
      limits:
        example.com/deviceA: "1"
        example.com/deviceB: "1"
      requests:
        example.com/deviceA: "1"
        example.com/deviceB: "1"
