# The docs' "Pod interactions with topology manager policies" example #4 (Guaranteed, shared CPU), spec verbatim, wrapped.
apiVersion: v1
kind: Pod
metadata:
  name: guaranteed-shared-cpu
  namespace: topo-demo
spec:
  containers:
  - name: nginx
    image: nginx
    resources:
      limits:
        memory: "200Mi"
        cpu: "300m"
        example.com/device: "1"
      requests:
        memory: "200Mi"
        cpu: "300m"
        example.com/device: "1"
