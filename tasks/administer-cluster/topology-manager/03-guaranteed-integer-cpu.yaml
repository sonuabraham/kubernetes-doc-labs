# The docs' "Pod interactions with topology manager policies" example #3 (Guaranteed, integer CPU), spec verbatim, wrapped.
apiVersion: v1
kind: Pod
metadata:
  name: guaranteed-integer-cpu
  namespace: topo-demo
spec:
  containers:
  - name: nginx
    image: nginx
    resources:
      limits:
        memory: "200Mi"
        cpu: "2"
        example.com/device: "1"
      requests:
        memory: "200Mi"
        cpu: "2"
        example.com/device: "1"
