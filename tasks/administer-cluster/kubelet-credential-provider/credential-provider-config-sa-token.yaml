# Not from the docs: this lab's plugin in "service account token" mode (gate KubeletServiceAccountTokenForCredentialProviders,
# beta/on in 1.37). The kubelet now requests a token for the Pod's ServiceAccount with audience "lab-registry" and
# passes it (plus selected SA annotations) to the plugin, which could exchange it for registry credentials.
apiVersion: kubelet.config.k8s.io/v1
kind: CredentialProviderConfig
providers:
  - name: lab-credential-provider
    matchImages:
      - "localhost:5000/private"
    defaultCacheDuration: "5m"
    apiVersion: credentialprovider.kubelet.k8s.io/v1
    tokenAttributes:
      serviceAccountTokenAudience: "lab-registry"
      cacheType: "Token"
      requireServiceAccount: true
      optionalServiceAccountAnnotationKeys:
      - "lab.example.com/registry-role"
