# Not from the docs: a Pod using the private image - note: NO imagePullSecrets. It can only start if the kubelet
# gets credentials for localhost:5000 some other way (the credential provider plugin).
apiVersion: v1
kind: Pod
metadata:
  name: private-app
  namespace: cred-demo
spec:
  containers:
  - name: app
    image: localhost:5000/private/busybox:1.36
    imagePullPolicy: Always
    command: ["sh", "-c", "echo pulled with plugin-provided credentials; sleep 3600"]
