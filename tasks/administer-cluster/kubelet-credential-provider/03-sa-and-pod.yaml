# Not from the docs: a ServiceAccount carrying an annotation the plugin asked for, and a Pod using it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: puller
  namespace: cred-demo
  annotations:
    lab.example.com/registry-role: "reader"
---
apiVersion: v1
kind: Pod
metadata:
  name: private-app-sa
  namespace: cred-demo
spec:
  serviceAccountName: puller
  containers:
  - name: app
    image: localhost:5000/private/busybox:1.36
    imagePullPolicy: Always
    command: ["sleep", "3600"]
