# Not from the docs (the docs' ECR example is credential-provider-config-ecr.yaml): the config for this lab's
# plugin. Passed to the kubelet with --image-credential-provider-config; the binary named in "name" must be in
# the --image-credential-provider-bin-dir directory.
apiVersion: kubelet.config.k8s.io/v1
kind: CredentialProviderConfig
providers:
  - name: lab-credential-provider
    matchImages:
      - "localhost:5000/private"        # host:port must match; path is a prefix match
    defaultCacheDuration: "5m"
    apiVersion: credentialprovider.kubelet.k8s.io/v1
    args:
      - --example-argument
