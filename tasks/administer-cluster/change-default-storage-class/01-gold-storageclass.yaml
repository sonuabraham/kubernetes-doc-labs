# Not from the docs: a second StorageClass named "gold" (the docs' example name) using minikube's hostpath
# provisioner, so there is something to switch the default to.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gold
provisioner: k8s.io/minikube-hostpath
reclaimPolicy: Delete
volumeBindingMode: Immediate
