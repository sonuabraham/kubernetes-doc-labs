# Not from the docs: the page's note - Pods that still land on a drained (cordoned) node.
# 1. tolerates node.kubernetes.io/unschedulable  (the scheduler may pick the drained node; pinned here with nodeSelector)
# 2. sets spec.nodeName directly (bypasses the scheduler entirely)
apiVersion: v1
kind: Pod
metadata:
  name: tolerates-unschedulable
spec:
  nodeSelector: {kubernetes.io/hostname: drain-lab-m02}
  tolerations:
  - key: node.kubernetes.io/unschedulable
    operator: Exists
    effect: NoSchedule
  containers:
  - {name: c, image: busybox:1.36, command: ["sleep", "3600"]}
---
apiVersion: v1
kind: Pod
metadata:
  name: bound-by-nodename
spec:
  nodeName: drain-lab-m02
  containers:
  - {name: c, image: busybox:1.36, command: ["sleep", "3600"]}
---
apiVersion: v1
kind: Pod
metadata:
  name: ordinary
spec:
  nodeSelector: {kubernetes.io/hostname: drain-lab-m02}
  containers:
  - {name: c, image: busybox:1.36, command: ["sleep", "3600"]}
