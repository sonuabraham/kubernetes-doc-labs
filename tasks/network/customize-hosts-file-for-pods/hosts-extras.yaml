# NOT from the docs: how hostname/subdomain and hostNetwork change /etc/hosts.
apiVersion: v1
kind: Pod
metadata:
  name: hosts-subdomain
spec:
  restartPolicy: Never
  hostname: web-0
  subdomain: demo
  hostAliases:
  - ip: "10.1.2.3"
    hostnames: ["foo.remote"]
  containers:
  - name: cat-hosts
    image: busybox:1.36
    command: ["cat", "/etc/hosts"]
---
apiVersion: v1
kind: Pod
metadata:
  name: hosts-hostnetwork
spec:
  restartPolicy: Never
  hostNetwork: true
  hostAliases:
  - ip: "10.1.2.3"
    hostnames: ["foo.remote"]
  containers:
  - name: cat-hosts
    image: busybox:1.36
    command: ["cat", "/etc/hosts"]
