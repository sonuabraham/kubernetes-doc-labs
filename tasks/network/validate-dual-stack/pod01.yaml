# NOT from the docs as a file: the page's pod01 with its downward-API env snippet (MY_POD_IPS from status.podIPs),
# plus a label so the docs' Services (selector app.kubernetes.io/name: MyApp) find it. nginx listens on 80.
apiVersion: v1
kind: Pod
metadata:
  name: pod01
  labels:
    app.kubernetes.io/name: MyApp
spec:
  containers:
  - name: web
    image: nginx:1.27
    env:
    - name: MY_POD_IPS
      valueFrom:
        fieldRef:
          fieldPath: status.podIPs
