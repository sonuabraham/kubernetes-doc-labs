# NOT from the docs – variant of haproxy.cfg: HTTPS health check on /readyz instead of a TCP check (catches a hung API server).
global
  log stdout format raw local0
defaults
  mode tcp
  timeout connect 5s
  timeout client 1h
  timeout server 1h
  log global
frontend kube-apiserver
  bind *:6443
  default_backend control-plane
backend control-plane
  option httpchk GET /readyz
  http-check expect status 200
  balance roundrobin
  server cp1 kadm-cp1:6443 check check-ssl verify none inter 2s fall 2 rise 2 init-addr last,libc,none
  server cp2 kadm-cp2:6443 check check-ssl verify none inter 2s fall 2 rise 2 init-addr last,libc,none
  server cp3 kadm-cp3:6443 check check-ssl verify none inter 2s fall 2 rise 2 init-addr last,libc,none
