# NOT from the docs – the "kube-apiserver load balancer" for the HA lab: TCP passthrough on :6443 with a TCP health check
# per control plane node, as the page describes ("The health check for an apiserver is a TCP check on the port").
global
  log stdout format raw local0
defaults
  mode tcp
  timeout connect 5s
  timeout client 1h
  timeout server 1h
  log global
frontend kube-apiserver
  bind *:6443
  default_backend control-plane
backend control-plane
  option tcp-check
  balance roundrobin
  server cp1 kadm-cp1:6443 check inter 2s fall 2 rise 2 init-addr last,libc,none
  server cp2 kadm-cp2:6443 check inter 2s fall 2 rise 2 init-addr last,libc,none
  server cp3 kadm-cp3:6443 check inter 2s fall 2 rise 2 init-addr last,libc,none
