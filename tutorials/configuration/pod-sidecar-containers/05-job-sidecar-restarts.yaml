# NOT from the docs – benefit 4: with restartPolicy: Never the sidecar is still restarted when it exits.
apiVersion: batch/v1
kind: Job
metadata:
  name: job-sidecar-restarts
spec:
  template:
    spec:
      restartPolicy: Never
      initContainers:
      - name: flaky-sidecar
        image: alpine:3
        restartPolicy: Always
        command: ["sh", "-c", "echo sidecar run; sleep 3; exit 1"]
      containers:
      - name: main
        image: alpine:3
        command: ["sh", "-c", "sleep 25; echo main done"]
