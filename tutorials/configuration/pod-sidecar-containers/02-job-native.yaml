# NOT from the docs – benefit 3: a native sidecar does not block Job completion.
apiVersion: batch/v1
kind: Job
metadata:
  name: job-native-sidecar
spec:
  template:
    spec:
      restartPolicy: Never
      initContainers:
      - name: sidecar
        image: alpine:3
        restartPolicy: Always
        command: ["sh", "-c", "while true; do sleep 1; done"]
      containers:
      - name: main
        image: alpine:3
        command: ["sh", "-c", "echo working; sleep 5; echo done"]
