# The docs show only the metadata of pv1 (annotation pv.beta.kubernetes.io/gid). spec, the PVC and the Pod are NOT from the docs.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv1
  annotations:
    pv.beta.kubernetes.io/gid: "1234"
spec:
  storageClassName: gid-demo
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  hostPath:
    path: /mnt/data-gid
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pv1-claim
spec:
  storageClassName: gid-demo
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: gid-demo
spec:
  securityContext:
    runAsUser: 1000
  containers:
  - name: c
    image: alpine:3
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: v
      mountPath: /data
  volumes:
  - name: v
    persistentVolumeClaim:
      claimName: pv1-claim
