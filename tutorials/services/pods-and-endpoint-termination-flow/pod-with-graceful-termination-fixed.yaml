# NOT from the docs – pod-with-graceful-termination.yaml with the preStop sleep action fixed: the docs' "sleep: 180" is rejected twice
# (sleep must be an object {seconds: N}, and N must be < terminationGracePeriodSeconds 120). 119 = "hang around for the grace period".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      terminationGracePeriodSeconds: 120 # extra long grace period
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        lifecycle:
          preStop:
            # Real life termination may take any time up to terminationGracePeriodSeconds.
            # In this example - just hang around for at least the duration of terminationGracePeriodSeconds,
            # at 120 seconds container will be forcibly terminated.
            # Note, all this time nginx will keep processing requests.
            sleep:
              seconds: 119
